<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" href="ProjectLogo3.svg" type="image/svg">
    <link rel="stylesheet" href="css/style.css">

    <title>DHI Taxonomic Notebook v1.3.0 by [虹蘅馆 Domus Herbārum Īridēscentium]</title>

    <script src="libs/marked.min.js"></script>
    <script src="libs/Sortable.min.js"></script>
    <script src="libs/purify.min.js"></script>
    <script src="libs/jszip.min.js"></script>
    <script src="libs/xlsx.full.min.js"></script>

    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script src="js/markdownExporter.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/comparison.js"></script>
    <script src="js/main.js"></script>
    <script src="js/excelImport.js"></script>
</head>
<body>

    <!-- ===== 侧边栏 ===== -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-resizer" id="sidebarResizer"></div>
        <div class="sidebar-header">
            <h2><img src="ProjectLogo3.svg" alt="DHI Logo" style="height: 4em; vertical-align: middle; margin-right: 0.2em;"> DHI Taxonomic Notebook<small>v1.3.0</small></h2>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="搜索分类群或物种..." autocomplete="off" />
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>

        <div class="toolbar">
            <!-- 编辑模式（独立按钮，保持原样） -->
            <button id="editToggleBtn" class="btn-primary" onclick="toggleEditMode()">✎ 编辑模式</button>

            <!-- 导入下拉菜单 -->
            <div class="dropdown">
                <button class="dropbtn">📥︎ 导入 ⌵</button>
                <div class="dropdown-content">
                    <a href="#" onclick="document.getElementById('importFile').click(); return false;">📥︎ 导入JSON</a>
                    <a href="#" id="excelImportBtn">▦ Excel批量导入物种</a>
                </div>
            </div>

            <!-- 导出下拉菜单 -->
            <div class="dropdown">
                <button class="dropbtn">📤︎ 导出 ⌵</button>
                <div class="dropdown-content">
                    <a href="#" onclick="exportData(); return false;">📤︎ 导出JSON</a>
                    <a href="#" onclick="exportMarkdownPackageFromUI(); return false;">📦︎ 导出Markdown ZIP</a>
                </div>
            </div>

            <!-- 清理下拉菜单 -->
            <div class="dropdown">
                <button class="dropbtn">⌧ 清理 ⌵</button>
                <div class="dropdown-content">
                    <a href="#" onclick="scanOrphanImages(); return false;">⌧ 清理孤立图片</a>
                    <a href="#" onclick="resetAll(); return false;" class="danger">🗑 重置</a>
                </div>
            </div>

            <!-- 隐藏的 JSON 文件选择器（仍用于导入 JSON） -->
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>

        <div class="tree-wrap" id="treeWrap">
            <div id="treeRoot"></div>
        </div>
    </div>


    <!-- ===== 主区域 ===== -->
    <div class="main" id="mainArea">
        <!-- 快速选择模式 Banner -->
        <div id="quickSelectBanner" style="display:none;">
            <span style="font-weight:600; color: var(--primary);">➤ 正在选择对比物种</span>
            <span>点击物种（或种下等级）以加入或取消选择</span>
            <span>已选择 <strong id="quickSelectCount">0</strong> / <span id="quickSelectMax">4</span></span>
            <div style="display:flex; gap:8px;">
                <button id="quickSelectClearBtn" class="btn-cancel" style="font-size:0.8rem; padding:4px 12px;">清空</button>
                <button id="quickSelectCompareBtn" class="btn-save" style="font-size:0.8rem; padding:4px 16px;">进入对比</button>
            </div>
        </div>
        <div class="main-empty" id="emptyState">
            <div style="font-size:2.8rem;">∅</div>
            <div>点击左侧分类群查看内容</div>
            <div class="hint">开启 <code>编辑模式</code> 可添加、删除、拖拽排序</div>
        </div>
        <div id="mainContent" style="display:none;flex:1;display:none;flex-direction:column;">
            <div class="main-header" id="mainHeader"></div>
            <div class="main-content-wrap" id="mainContentWrap"></div>
        </div>
    </div>

    <!-- ===== 通用模态框 ===== -->
    <div class="modal-overlay" id="genericModal">
        <div class="modal" id="modalContainer">
            <button class="modal-close" id="modalCloseBtn">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ===== 物种详情模态框 ===== -->
    <div class="modal-overlay" id="speciesModal">
        <div class="modal species-detail" id="speciesModalContainer">
            <button class="modal-close" id="speciesModalClose">&times;</button>
            <div id="speciesDetailBody"></div>
        </div>
    </div>

    <!-- ===== 灯箱 ===== -->
    <div class="lightbox" id="lightbox">
        <button class="close" id="lightboxClose">&times;</button>
        <img src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" 
            alt="" 
            id="lightboxImg" />
        <div class="caption" id="lightboxCaption"></div>
    </div>

    <!-- ===== Comparison View (Phase 1B) ===== -->
    <div id="comparisonView" class="comparison-view" hidden>
        <div class="comparison-view__header">
            <div style="display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;">
                <h2>物种对比</h2>
                <span id="comparisonViewStatus" style="font-size:0.85rem; color:#888; font-weight:400;">
                    已选择 0 / 4 个物种
                </span>
                <div style="display:flex; gap:4px; margin-left:12px; align-items:center;">
                    <button id="comparisonModeParallel" class="mode-toggle-btn active" data-mode="parallel">独立滚动</button>
                    <button id="comparisonModeTable" class="mode-toggle-btn" data-mode="table">对齐滚动</button>
                </div>
            </div>
            <button type="button" id="comparisonViewClose" class="comparison-view__close" aria-label="关闭物种对比">×</button>
        </div>
        <div id="comparisonViewBody" class="comparison-view__body"></div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>
</body>
</html>
