        // ============================================================
        // 🧩 通用模态框（支持剪贴板粘贴按钮 + 图片排序）
        // ============================================================

        function showModal(options) {
            const overlay = document.getElementById('genericModal');

            // 如果旧模态框处于打开状态，尝试关闭（带脏检查）
            if (overlay && overlay.classList.contains('active')) {
                tryCloseModal(overlay);
                // 如果用户取消关闭，则停止创建新模态框
                if (overlay.classList.contains('active')) {
                    return;
                }
            }

            const body = document.getElementById('modalBody');

            // ---------- 辅助：渲染字段 ----------
            function renderField(f) {
                const val = f.value || '';
                const placeholder = f.placeholder || '';
                const rows = f.rows || 3;
                const withPaste = f.withPaste || false;
                const isImageField = f.isImageField || false;
                let pasteBtn = '';
                if (withPaste) {
                    pasteBtn = `
                        <div class="paste-area">
                            <button class="paste-btn" onclick="pasteImageFromClipboard('modal_${f.id}')">📋︎ 从剪贴板粘贴图片</button>
                            <span style="font-size:0.75rem;color:#999;">（将自动压缩并存入 IndexedDB）</span>
                        </div>
                    `;
                }
                let imageFieldAttr = isImageField ? ' data-image-field="true"' : '';
                let html = '';

                if (f.type === 'textarea') {
                    html = `
                        <div class="form-group">
                            <label>${f.label}</label>
                            <textarea id="modal_${f.id}" placeholder="${placeholder}" rows="${rows}"${imageFieldAttr}>${val}</textarea>
                            ${pasteBtn}
                        </div>
                    `;
                } else if (f.type === 'select') {
                    let optionsHtml = '';
                    if (f.options && f.options.length) {
                        for (let opt of f.options) {
                            const selected = (opt.value === val) ? 'selected' : '';
                            optionsHtml += `<option value="${opt.value}" ${selected}>${opt.label}</option>`;
                        }
                    }
                    const rankNameField = f.rankNameField || '';
                    html = `
                        <div class="form-group">
                            <label>${f.label}</label>
                            <select id="modal_${f.id}" ${rankNameField ? `data-rank-name-field="modal_${rankNameField}"` : ''}>
                                ${optionsHtml}
                            </select>
                        </div>
                    `;
                } else {
                    // 普通 text，支持 hidden
                    const hiddenStyle = f.hidden ? 'display:none;' : '';
                    const disabledAttr = f.hidden ? 'disabled' : '';
                    html = `
                        <div class="form-group">
                            <label>${f.label}</label>
                            <input type="text" id="modal_${f.id}" placeholder="${placeholder}" value="${val}" style="${hiddenStyle}" ${disabledAttr} />
                        </div>
                    `;
                }
                return html;
            }

            // ---------- 解析字段并分组 ----------
            function buildHTML(fields) {
                if (!fields || fields.length === 0) return '';

                // 检查是否有分组标记（group-start）
                const hasGroups = fields.some(f => f.type === 'group-start' || f.type === 'group-end');

                // ===== 情况1：无分组（平铺字段） =====
                if (!hasGroups) {
                    let html = '';
                    let i = 0;
                    while (i < fields.length) {
                        const current = fields[i];
                        if (current.inline) {
                            // 收集连续的 inline 字段
                            const rowFields = [];
                            while (i < fields.length && fields[i].inline) {
                                rowFields.push(fields[i]);
                                i++;
                            }
                            if (rowFields.length === 1) {
                                html += renderField(rowFields[0]);
                            } else {
                                html += `<div class="form-row">`;
                                for (let rf of rowFields) {
                                    html += renderField(rf);
                                }
                                html += `</div>`;
                            }
                        } else {
                            html += renderField(current);
                            i++;
                        }
                    }
                    return html;
                }

                // ===== 情况2：有分组（现有逻辑） =====
                let html = '';
                let i = 0;
                while (i < fields.length) {
                    const f = fields[i];
                    if (f.type === 'group-start') {
                        html += `<div class="form-section">`;
                        html += `<h3 class="form-section-title">${f.label}</h3>`;
                        i++;
                        const groupFields = [];
                        while (i < fields.length && fields[i].type !== 'group-end') {
                            groupFields.push(fields[i]);
                            i++;
                        }
                        // 渲染组内字段（同样处理 inline）
                        let j = 0;
                        while (j < groupFields.length) {
                            const current = groupFields[j];
                            if (current.inline) {
                                const rowFields = [];
                                while (j < groupFields.length && groupFields[j].inline) {
                                    rowFields.push(groupFields[j]);
                                    j++;
                                }
                                if (rowFields.length === 1) {
                                    html += renderField(rowFields[0]);
                                } else {
                                    html += `<div class="form-row">`;
                                    for (let rf of rowFields) {
                                        html += renderField(rf);
                                    }
                                    html += `</div>`;
                                }
                            } else {
                                html += renderField(current);
                                j++;
                            }
                        }
                        if (i < fields.length && fields[i].type === 'group-end') {
                            html += `</div>`;
                            i++;
                        }
                    } else {
                        // 忽略其他非 group-start 顶层（安全保护）
                        i++;
                    }
                }
                return html;
            }

            // ---------- 构建最终内容 ----------
            let fieldsHTML = options.fields ? buildHTML(options.fields) : '';
            let contentHTML = options.content || '';

            cleanupBlobURLs(body);
            body.innerHTML = `
                <div class="modal-header">
                    <h2>${options.title || '编辑'}</h2>
                </div>
                <div class="modal-body">
                    ${fieldsHTML}
                    ${contentHTML}
                </div>
                ${options.hideFooter ? '' : `
                <div class="modal-footer">
                    <button class="btn-cancel" onclick="tryCloseModal(document.getElementById('genericModal'))">取消</button>
                    <button class="btn-save" id="modalSaveBtn">${options.saveText || '💾︎ 保存'}</button>
                </div>
                `}
            `;

            overlay.classList.add('active');
            overlay._dirty = false;

            // 绑定 rank 自定义切换
            setTimeout(() => {
                bindRankCustomToggle(document.getElementById('modalContainer'));
            }, 50);

            // 绑定输入变化
            body.querySelectorAll('input, textarea, select').forEach(el => {
                ['input', 'change'].forEach(type => {
                    el.addEventListener(type, function onInput() {
                        overlay._dirty = true;
                    });
                });
            });

            // 图片排序初始化
            if (!options.hideFooter) {
                setTimeout(() => {
                    initImageSortable(document.getElementById('modalContainer'));
                }, 50);
            }

            // 保存按钮
            if (!options.hideFooter) {
                document.getElementById('modalSaveBtn').onclick = function() {
                    const data = {};
                    if (options.fields) {
                        for (let f of options.fields) {
                            if (f.type === 'group-start' || f.type === 'group-end') continue;
                            const el = document.getElementById('modal_' + f.id);
                            if (el) data[f.id] = el.value;
                        }
                    }
                    if (options.onSave) {
                        const result = options.onSave(data);
                        if (result !== false) {
                            overlay._dirty = false;
                            closeModal();
                        }
                    } else {
                        overlay._dirty = false;
                        closeModal();
                    }
                };
            }

            document.getElementById('modalCloseBtn').onclick = function() {
                tryCloseModal(overlay);
                if (options.onClose) options.onClose();
            };

            overlay.onclick = null;
            if (options.allowOverlayClose) {
                overlay.onclick = function(e) {
                    if (e.target === overlay) {
                        tryCloseModal(overlay);
                        if (options.onClose) options.onClose();
                    }
                };
            }
        }

        function tryCloseModal(overlay) {
            if (!overlay) {
                    overlay = document.getElementById('genericModal');
                if (!overlay || !overlay.classList.contains('active')) return;
            }
            if (!overlay._dirty) {
                closeModal();
                return;
            }
            if (confirm('当前修改尚未保存，确定放弃吗？')) {
                closeModal();
            }
        }

        function closeModal() {
            const overlay = document.getElementById('genericModal');
            if (!overlay) return;

            // ---------- 清理所有图片排序容器 ----------
            const containers = overlay.querySelectorAll('.image-sortable-list');
            containers.forEach(container => {
                //销毁 Sortable 实例
                if (container._sortableInstance) {
                    container._sortableInstance.destroy();
                    container._sortableInstance = null;
                }
                cleanupBlobURLs(container);
                //清空容器内容
                container.innerHTML = '';
            });

            // ---------- 关闭模态框 ----------
            overlay.classList.remove('active');
        }

        // ============================================================
        // 💾 数据持久化（统一版本管理）
        // ============================================================

        function saveData() {
            if (treeData) {
                treeData.version = CURRENT_VERSION;
            }
            localStorage.setItem('taxonomyNotesData', JSON.stringify(treeData));
            localStorage.setItem('taxonProfiles', JSON.stringify(taxonProfiles));
        }

        function loadData() {
            const saved = localStorage.getItem('taxonomyNotesData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (!parsed.version) parsed.version = '1.0';
                    parsed.version = migrateData(parsed);
                    treeData = parsed;
                    idCounter = rebuildIdCounter(treeData);
                } catch (e) {
                    console.warn('数据加载失败，将使用默认数据', e);
                    return false;
                }
            } else {
                return false;
            }

            const profiles = localStorage.getItem('taxonProfiles');
            if (profiles) {
                try {
                    taxonProfiles = JSON.parse(profiles);
                } catch (e) {
                    console.warn('taxonProfiles 损坏，重新创建', e);
                    taxonProfiles = {};
                }
            } else {
                taxonProfiles = {};
            }

            ensureAllNodesHaveProfile(treeData);
            migrateAllProfiles();

            return true;
        }

        // ===== 版本迁移系统（P0-1 改进） =====
        function migrateData(data) {
            const version = data.version || '1.0';
            let migrated = data;

            // ---- 未来迁移规则（留空） ----
            // if (version === '1.0') { ... 迁移到 1.2 }
            // if (version === '1.2') { ... 迁移到 2.0 }
            // ... 更多迁移

            // 当前所有版本都执行字段补全（向下兼容）
            migrated = ensureAllFields(migrated);

            // 更新版本号为最新
            migrated.version = CURRENT_VERSION;
            return migrated.version; // 返回最新版本
        }

        // 补全缺失字段（确保所有节点结构完整）
        function ensureAllFields(data) {
            function walk(node) {
                if (!node) return;
                node.photos ||= [];
                node.children ||= [];
                node.type ||= 'taxon';

                // --- ✅ 第一步：迁移旧物种节点（type === 'species'）为 taxon ---
                if (node.type === 'species') {
                    // 1. 迁移旧字段 latinName / authors → scientificNameRaw
                    if (node.latinName || node.authors) {
                        let combined = (node.latinName || '') + (node.authors ? ' ' + node.authors : '');
                        if (combined.trim() && !node.scientificNameRaw) {
                            const parsed = parseScientificName(combined);
                            node.scientificNameRaw = combined.trim();
                            node.scientificName = parsed.scientificName;
                            node.author = parsed.author;
                        }
                        delete node.latinName;
                        delete node.authors;
                    }

                    // 2. 确保所有物种特有字段存在
                    node.scientificNameRaw = node.scientificNameRaw || '';
                    node.scientificName = node.scientificName || '';
                    node.author = node.author || '';
                    node.commonName = node.commonName || '';
                    node.distribution = node.distribution || '';
                    node.habitat = node.habitat || '';
                    node.synonyms = node.synonyms || [];
                    node.diagnosis = node.diagnosis || '';
                    node.description = node.description || '';
                    node.discussion = node.discussion || '';
                    node.references = node.references || [];

                    // 3. 设置显示名称 name（优先 commonName，其次 scientificName）
                    node.name = node.commonName || node.scientificName || '未命名物种';

                    // 4. ⭐ 转换为 taxon，设置 rank 为 species（若已有 rank 则保留）
                    node.type = 'taxon';
                    node.rank = node.rank || 'species';
                    node.rankName = '';  // 物种的 rankName 恒为空
                }

                // --- 第二步：处理 content 节点 ---
                if (node.type === 'content') {
                    node.html = node.html || '';
                }

                // --- 第三步：处理所有 taxon 节点（包括迁移后的物种） ---
                if (node.type === 'taxon') {
                    // 确保 name 字段（若为空则补默认值，但不会覆盖已有值）
                    node.name = node.name || '未命名分类群';

                    // ⭐ 补全：如果节点拥有物种字段但 rank 为空，默认设为 species
                    if ((node.scientificName || node.commonName) && !node.rank) {
                        node.rank = 'species';
                        node.rankName = '';
                    }

                    // 标准阶元列表（与添加子分类的选项保持一致）
                    const STANDARD_RANKS = [
                        'domain', 'kingdom', 'phylum', 'class', 'order',
                        'family', 'genus', 'species', 'subspecies', 'variety', 'form'
                    ];

                    // 处理 rank 迁移：非标准值转为 custom，并存入 rankName
                    if (node.rank !== undefined && node.rank !== null && node.rank !== '') {
                        if (STANDARD_RANKS.includes(node.rank)) {
                            node.rankName = '';   // 标准阶元清空 rankName
                        } else {
                            // 如果已经是 custom，则保留现有 rankName（不覆盖）
                            if (node.rank === 'custom') {
                                // 仅保证 rankName 存在（可为空）
                                if (node.rankName === undefined || node.rankName === null) {
                                    node.rankName = '';
                                }
                            } else {
                                // 其他非标准值 → 迁移为 custom，原值存入 rankName
                                node.rankName = node.rank;
                                node.rank = 'custom';
                            }
                        }
                    } else {
                        node.rank = '';
                        node.rankName = '';
                    }
                }

                // --- 递归处理子节点 ---
                if (node.children) {
                    for (let child of node.children) {
                        walk(child);
                    }
                }
            }
            walk(data);
            return data;
        }

        function saveAndRefresh() {
            saveData();
            renderTree();
            if (selectedNode) {
                const refreshed = findNodeById(treeData, selectedNode.id);
                if (refreshed) { selectedNode = refreshed;
                    showTaxonContent(refreshed); } else { selectedNode = treeData;
                    showTaxonContent(treeData); }
            }
        }

        // ============================================================
        // 📤 导入导出（含 IndexedDB 图片 + UUID 冲突处理 + 版本兼容）
        // ============================================================

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                    // ---------- 确认覆盖提示 ----------
                if (!confirm('⚠️ 导入JSON将覆盖当前所有数据（包括图片），确定继续吗？')) {
                    event.target.value = '';   // 清空文件输入，避免再次触发
                    return;
                }
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.treeData || !data.treeData.id) {
                        toast('❌ 无效的数据格式：缺少 treeData');
                        return;
                    }

                    // 版本迁移（treeData）
                    let importedTree = data.treeData;
                    if (!importedTree.version) importedTree.version = '1.0';
                    const newVersion = migrateData(importedTree);
                    importedTree.version = newVersion;

                    // UUID 冲突处理
                    let existingUUIDs = new Set();
                    try {
                        const existing = await getAllImagesFromDB();
                        existingUUIDs = new Set(existing.map(entry => entry.id));
                    } catch (err) {
                        console.warn('获取已有图片列表失败', err);
                    }

                    const conflictMap = {};
                    const imageEntries = data.images || {};
                    for (let [uuid, base64] of Object.entries(imageEntries)) {
                        if (existingUUIDs.has(uuid)) {
                            const newUuid = generateUUID();
                            conflictMap[uuid] = newUuid;
                            console.log(`⚠️ UUID 冲突: ${uuid} -> ${newUuid}`);
                        }
                    }

                    if (Object.keys(conflictMap).length > 0) {
                        const jsonStr = JSON.stringify(importedTree);
                        let updatedStr = jsonStr;
                        for (let [oldUuid, newUuid] of Object.entries(conflictMap)) {
                            updatedStr = updatedStr.split(`[img:${oldUuid}]`).join(`[img:${newUuid}]`);
                        }
                        importedTree = JSON.parse(updatedStr);
                        toast(`🔄 检测到 ${Object.keys(conflictMap).length} 个UUID冲突，已自动重新生成`);
                    }

                    // 恢复图片到 IndexedDB
                    let savedCount = 0;
                    for (let [uuid, base64] of Object.entries(imageEntries)) {
                        try {
                            const finalUuid = conflictMap[uuid] || uuid;
                            const response = await fetch(base64);
                            const blob = await response.blob();
                            await saveImageToDB(finalUuid, blob);
                            savedCount++;
                        } catch (err) {
                            console.warn('图片恢复失败', uuid, err);
                        }
                    }

                    // ---- 替换 treeData ----
                    treeData = importedTree;

                    // ---- 导入 taxonProfiles（兼容旧版本） ----
                    taxonProfiles = data.taxonProfiles || {};
                    ensureAllNodesHaveProfile(treeData);
                    migrateAllProfiles();

                    // ---- 清理孤儿 profile：仅保留 treeData 中存在的节点 ----
                    const validIds = new Set();
                    collectAllNodeIds(treeData).forEach(id => validIds.add(id));
                    for (const id of Object.keys(taxonProfiles)) {
                        if (!validIds.has(id)) {
                            delete taxonProfiles[id];
                            console.log(`🧹 移除孤立的 profile: ${id}`);
                        }
                    }

                    idCounter = rebuildIdCounter(treeData);
                    saveData();
                    
                    selectedNode = treeData;
                    renderTree();
                    showTaxonContent(treeData);
                    localStorage.setItem('lastExportTime', Date.now().toString());

                    toast(`✅ 导入成功！版本 ${data.version || '1.0'} → ${importedTree.version}，恢复 ${savedCount} 张本地内嵌图片`);
                } catch (err) {
                    console.error('导入失败:', err);
                    toast('❌ 导入失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        // 📤 导出（统一使用 treeData.version）
        // ============================================================

        // 辅助函数：收集树中所有被引用的图片 UUID
        function collectAllReferencedUUIDs(root) {
            const uuids = [];
            function walk(node) {
                if (!node) return;
                // 检查当前节点的 photos
                if (Array.isArray(node.photos)) {
                    for (let p of node.photos) {
                        if (p.isImageRef && p.uuid) {
                            uuids.push(p.uuid);
                        }
                    }
                }
                // 递归子节点
                if (Array.isArray(node.children)) {
                    for (let child of node.children) {
                        walk(child);
                    }
                }
            }
            walk(root);
            return uuids;
        }

        async function exportData() {
            // ===== 1. 生成安全的默认文件名（含完整时间） =====
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const dateStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
            const timeStr = `${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
            const defaultName = `分类学笔记_${dateStr}_${timeStr}`;

            // ===== 2. 弹窗让用户自定义文件名 =====
            let fileName = prompt('请输入导出的JSON文件名（不含扩展名）：', defaultName);
            if (fileName === null) return; // 用户取消
            fileName = fileName.trim() || defaultName;
            if (!fileName.toLowerCase().endsWith('.json')) {
                fileName += '.json';
            }

            try {
                // ===== 3. 收集树中实际引用的 UUID =====
                const referencedUUIDs = new Set(collectAllReferencedUUIDs(treeData));
                console.log(`📊 树中引用图片数: ${referencedUUIDs.size}`);

                // ===== 4. 获取 IndexedDB 全部图片，但只导出被引用的 =====
                const allImages = await getAllImagesFromDB();
                const imageMap = {};
                let exportedCount = 0;

                for (let entry of allImages) {
                    // 只导出在树中被引用的图片
                    if (!referencedUUIDs.has(entry.id)) {
                        console.debug(`⏭️ 跳过孤儿图片: ${entry.id}`);
                        continue;
                    }
                    try {
                        const base64 = await blobToBase64(entry.blob);
                        imageMap[entry.id] = base64;
                        exportedCount++;
                    } catch (e) {
                        console.warn('图片转换失败', entry.id, e);
                    }
                }

                // ===== 5. 组装并导出 =====
                const exportVersion = treeData.version || CURRENT_VERSION;
                const exportObj = {
                    treeData: treeData,
                    images: imageMap,
                    taxonProfiles: taxonProfiles,
                    version: exportVersion
                };

                const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = fileName;
                a.click();

                // ===== 6. 提示用户 =====
                localStorage.setItem('lastExportTime', Date.now().toString());
                // 显示实际导出的图片数（而非 IndexedDB 总数）
                toast(`📥 数据已导出（版本 ${exportVersion}，含 ${exportedCount} 张本地内嵌图片）`);
                
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            } catch (err) {
                console.error(err);
                toast('❌ 导出失败: ' + err.message);
            }
        }

        // ============================================================
        // 🔄 重置
        // ============================================================

        function resetAll() {
            if (!confirm('⚠️ 确定要重置所有数据吗？此操作不可撤销！')) return;
            treeData = deepClone(DEFAULT_DATA);
            treeData.version = CURRENT_VERSION;
            taxonProfiles = {};
            selectedNode = treeData;
            idCounter = 1000;
            saveData();
            getAllImagesFromDB().then(entries => {
                for (let entry of entries) {
                    deleteImageFromDB(entry.id).catch(() => {});
                }
            }).catch(() => {});
            renderTree();
            showTaxonContent(treeData);
            toast('🗑 已重置所有数据');
        }

        function collectUsedUUIDs() {
            const used = new Set();
            if (!treeData) return used;

            // 递归遍历树节点
            function walk(node) {
                if (!node) return;
                // 检查 photos 数组
                if (Array.isArray(node.photos)) {
                    for (let p of node.photos) {
                        if (p.isImageRef && p.uuid) {
                            used.add(p.uuid);
                        }
                    }
                }
                // 递归子节点
                if (Array.isArray(node.children)) {
                    for (let child of node.children) {
                        walk(child);
                    }
                }
            }
            walk(treeData);

            // 额外：通过 JSON 字符串正则提取（兜底）
            const jsonStr = JSON.stringify(treeData);
            const matches = jsonStr.match(/\[img:([^\]]+)\]/g);
            if (matches) {
                for (let m of matches) {
                    const uuid = m.slice(5, -1);
                    used.add(uuid);
                }
            }
            return used;
        }

        async function scanOrphanImages() {
            try {
                const used = collectUsedUUIDs();
                const allEntries = await getAllImagesFromDB();
                const orphans = allEntries.filter(entry => !used.has(entry.id));

                if (orphans.length === 0) {
                    toast('✅ 没有孤立图片，数据整洁！');
                    return;
                }

                // 计算总大小（近似）
                let totalSize = 0;
                for (let entry of orphans) {
                    totalSize += entry.blob.size;
                }
                const sizeMB = (totalSize / (1024 * 1024)).toFixed(1);

                // 构建孤儿列表预览（最多显示 20 条）
                let listHtml = orphans.slice(0, 20).map(e => 
                    `<div style="padding:2px 0;font-size:0.9rem;border-bottom:1px solid #eee;">${e.id}</div>`
                ).join('');
                if (orphans.length > 20) {
                    listHtml += `<div style="color:#888;padding:4px 0;">… 还有 ${orphans.length - 20} 个</div>`;
                }

                showModal({
                    title: `🧹 清理孤立图片（${orphans.length} 张）`,
                    content: `
                        <p>以下图片未被任何节点引用，占用约 <strong>${sizeMB} MB</strong>。</p>
                        <div style="max-height:200px;overflow-y:auto;background:#f9fafb;padding:6px 10px;border-radius:6px;border:1px solid #e0e4e8;margin:10px 0;">
                            ${listHtml}
                        </div>
                        <p style="color:#666;font-size:0.85rem;">删除后不可恢复，请确认已导出备份。</p>
                    `,
                    saveText: '🗑️ 删除全部孤立图片',  // ✅ 自定义按钮文字
                    onSave: async function() {
                        // ✅ 二次确认
                        if (!confirm(`确定删除 ${orphans.length} 张孤立图片吗？此操作不可撤销。`)) {
                            return false; // 返回 false 阻止模态框关闭
                        }
                        // 执行删除
                        let deleted = 0;
                        for (let entry of orphans) {
                            try {
                                await deleteImageFromDB(entry.id);
                                deleted++;
                            } catch (e) {
                                console.warn('删除失败', entry.id, e);
                            }
                        }
                        toast(`🗑 已删除 ${deleted} 张孤立图片，释放约 ${sizeMB} MB`);
                        // 可选：记录清理时间
                        localStorage.setItem('lastImageCleanup', Date.now().toString());
                        return true; // 允许关闭模态框
                    }
                });

            } catch (err) {
                console.error(err);
                toast('❌ 扫描失败：' + err.message);
            }
        }

        // ============================================================
        // 📐 左栏宽度拖拽
        // ============================================================

        function setupSidebarResizer() {
            const resizer = document.getElementById('sidebarResizer');
            const sidebar = document.getElementById('sidebar');
            let isResizing = false;

            resizer.addEventListener('mousedown', function(e) {
                isResizing = true;
                resizer.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onResize);
                document.addEventListener('mouseup', onResizeEnd);
                e.preventDefault();
            });

            function onResize(e) {
                if (!isResizing) return;
                const rect = sidebar.getBoundingClientRect();
                const newWidth = e.clientX - rect.left;
                if (newWidth >= 180 && newWidth <= 600) {
                    sidebar.style.width = newWidth + 'px';
                    document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
                }
            }

            function onResizeEnd() {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onResize);
                document.removeEventListener('mouseup', onResizeEnd);
                const w = sidebar.style.width;
                if (w) localStorage.setItem('sidebarWidth', w);
            }

            const savedWidth = localStorage.getItem('sidebarWidth');
            if (savedWidth) {
                const w = parseInt(savedWidth);
                if (w >= 180 && w <= 600) {
                    sidebar.style.width = w + 'px';
                    document.documentElement.style.setProperty('--sidebar-width', w + 'px');
                }
            }
        }

        // ============================================================
        // 📢 Toast（支持样式扩展）
        // ============================================================

        let toastTimer = null;

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            el.classList.remove('warning', 'info');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ============================================================
        // 🧩 全局异常处理
        // ============================================================

        function setupGlobalErrorHandling() {
            window.onerror = function(message, source, lineno, colno, error) {
                console.error('【全局错误】', message, source, lineno, colno, error);
                toast('⚠️ 发生未知错误，请按 F12 查看控制台详情');
                try {
                    const log = JSON.parse(localStorage.getItem('errorLog') || '[]');
                    log.push({
                        time: new Date().toISOString(),
                        message: String(message),
                        source: source || '',
                        lineno: lineno || 0,
                        colno: colno || 0,
                        stack: error ? error.stack : ''
                    });
                    if (log.length > 50) log.shift();
                    localStorage.setItem('errorLog', JSON.stringify(log));
                } catch (e) { /* 忽略日志写入错误 */ }
                return true;
            };

            window.onunhandledrejection = function(event) {
                console.error('【未处理的Promise拒绝】', event.reason);
                toast('⚠️ 发生异步错误，请按 F12 查看控制台详情');
                try {
                    const log = JSON.parse(localStorage.getItem('errorLog') || '[]');
                    log.push({
                        time: new Date().toISOString(),
                        type: 'unhandledrejection',
                        reason: String(event.reason)
                    });
                    if (log.length > 50) log.shift();
                    localStorage.setItem('errorLog', JSON.stringify(log));
                } catch (e) { /* 忽略 */ }
                event.preventDefault();
            };

            window.addEventListener('error', function(e) {
                if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'SCRIPT')) {
                    console.warn('资源加载失败:', e.target.src || e.target.href);
                    return;
                }
                if (!e.message) return;
                toast('⚠️ 页面发生错误，请查看控制台');
            }, true);
        }

        // ============================================================
        // 📌 备份提醒（P0-2 改进：首次启动用模态框）
        // ============================================================

        let backupCheckDone = false;

        function checkBackupReminder() {
            if (backupCheckDone) return;
            backupCheckDone = true;

            const hasSeenWelcome = localStorage.getItem('hasSeenWelcome');
            if (!hasSeenWelcome) {
                // 第一次启动：弹模态框
                showModal({
                    title: '欢迎使用 DHI 分类学笔记！',
                    content: `
                        <p style="font-size:1rem;line-height:1.8;">
                            数据保存在本地浏览器中，<strong>请定期导出 JSON 备份</strong>，以防缓存清理导致数据丢失。
                        </p>
                        <p style="margin-top:12px;color:#666;">
                            建议每次重要更新后点击「导出JSON」保存。
                        </p>
                        <div style="margin-top:20px;text-align:center;">
                            <button class="btn-save" onclick="closeModal();" style="font-size:1rem;padding:8px 32px;">知道了</button>
                        </div>
                    `,
                    hideFooter: true,
                    allowOverlayClose: true
                });
                localStorage.setItem('hasSeenWelcome', 'true');
                localStorage.setItem('lastBackupCheck', Date.now().toString());
                return;
            }

            // 非首次：检查是否超过7天未备份
            const lastExport = localStorage.getItem('lastExportTime');
            if (lastExport) {
                const days = (Date.now() - parseInt(lastExport)) / (1000 * 60 * 60 * 24);
                if (days > 7) {
                    const toastEl = document.getElementById('toast');
                    toastEl.classList.add('warning');
                    toast('⚠️ 已超过7天未备份数据，建议点击「导出JSON」保存。');
                    setTimeout(() => {
                        toastEl.classList.remove('warning');
                    }, 4000);
                }
            } else {
                // 从未导出过，温和提醒
                const lastCheck = localStorage.getItem('lastBackupCheck');
                if (!lastCheck || (Date.now() - parseInt(lastCheck)) > 24 * 60 * 60 * 1000) {
                    toast('💡 提示：点击「导出JSON」可备份所有数据（含图片）');
                    localStorage.setItem('lastBackupCheck', Date.now().toString());
                }
            }
        }

        // ============================================================
        // 🚀 初始化
        // ============================================================

        function init() {
            setupGlobalErrorHandling();

            if (!loadData()) {
                treeData = deepClone(DEFAULT_DATA);
                treeData.version = CURRENT_VERSION;
                selectedNode = treeData;
                idCounter = 1000;
                saveData();
            } else {
                if (!treeData || !treeData.id) {
                    treeData = deepClone(DEFAULT_DATA);
                    treeData.version = CURRENT_VERSION;
                    saveData();
                }
                // 确保所有字段完整（兼容旧数据）
                ensureAllFields(treeData);
                // 确保版本号
                treeData.version = CURRENT_VERSION;
                saveData();
                selectedNode = treeData;
            }

            renderTree();
            applyFontPreference();
            showTaxonContent(treeData);
            setupSearch();
            setupLightbox();
            setupSidebarResizer();

            // 恢复卡片尺寸 —— 从像素值反推滑块位置
            let savedPx = localStorage.getItem('cardSize');
            let percent = 50; // 默认
            if (savedPx) {
                const px = parseInt(savedPx, 10);
                if (!isNaN(px) && px >= 120 && px <= 400) {
                    percent = Math.round((px - 120) / (400 - 120) * 100);
                } else {
                    // 兼容旧版 small/medium/large
                    if (savedPx === 'small') percent = 15;
                    else if (savedPx === 'medium') percent = 50;
                    else if (savedPx === 'large') percent = 80;
                }
            } else {
                // 兼容旧版 cardSizePercent（如果存在）
                const oldPercent = localStorage.getItem('cardSizePercent');
                if (oldPercent) {
                    const p = parseInt(oldPercent, 10);
                    if (!isNaN(p) && p >= 0 && p <= 100) percent = p;
                    localStorage.removeItem('cardSizePercent');
                }
            }
            percent = Math.min(100, Math.max(0, percent));
            applyCardSize(percent);

            // 同步更新滑块位置（如果当前有滑块）
            const slider = document.querySelector('.size-control input[type="range"]');
            if (slider) slider.value = percent;

            if (localStorage.getItem('editMode') === 'true') {
                setTimeout(() => { if (!isEditMode) toggleEditMode(); }, 100);
            }

            // ---- 备份提醒（首次弹模态框，后续 Toast） ----
            setTimeout(checkBackupReminder, 600);

            document.getElementById('modalCloseBtn').onclick = closeModal;
            document.getElementById('speciesModalClose').onclick = function() {
                document.getElementById('speciesModal').classList.remove('active');
            };
            document.getElementById('speciesModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });

            document.addEventListener('keydown', function(e) {

                // Ctrl/Cmd + E
                if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
                    e.preventDefault();
                    toggleEditMode();
                    return;
                }

                // ===== Ctrl+Shift+F 切换字体 =====
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'F') {
                    e.preventDefault();
                    toggleFont();
                    return;
                }

                if (lightboxState.isOpen) {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        prevImage();
                        return;
                    }
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        nextImage();
                        return;
                    }
                }

                if (e.key !== 'Escape') return;

                // Lightbox（最高层）
                const lightbox = document.getElementById('lightbox');
                if (lightbox?.classList.contains('active')) {
                    e.preventDefault();
                    closeLightbox();
                    return;
                }

                // Generic Modal（次高层）
                const genericModal = document.getElementById('genericModal');
                if (genericModal?.classList.contains('active')) {
                    e.preventDefault();
                    tryCloseModal(genericModal);   // 传入参数，明确关闭对象
                    return;
                }

                // Species Modal（底层）
                const speciesModal = document.getElementById('speciesModal');
                if (speciesModal?.classList.contains('active')) {
                    e.preventDefault();
                    speciesModal.classList.remove('active');
                    return;
                }
            });

            console.info("DHI Taxonomic Notebook v1.2.0");
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
