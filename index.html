        // ============================================================
        // 🔄 树拖拽（跨分类移动）
        // ============================================================

function initTreeSortable() {
    treeSortableInstances.forEach(s => s.destroy());
    treeSortableInstances = [];

    const treeWrap = document.getElementById('treeWrap');
    const uls = treeWrap.querySelectorAll('ul');
    uls.forEach(ul => {
        const sortable = new Sortable(ul, {
            group: 'tree',
            animation: 150,
            handle: '.node-label',
            filter: 'li[data-placeholder="true"]',
            draggable: 'li:not([data-placeholder="true"])',
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            dragClass: 'sortable-drag',
            disabled: !isEditMode,

            onEnd: function(evt) {
                const item = evt.item;
                const nodeId = item.dataset.nodeId;
                if (!nodeId || nodeId === 'root') return;
                const node = findNodeById(treeData, nodeId);
                if (!node) return;

                const targetUl = evt.to;
                let parentLi = targetUl.closest('li');
                let targetParentId = parentLi ? parentLi.dataset.nodeId : 'root';
                let targetParent = targetParentId === 'root' ? treeData : findNodeById(treeData, targetParentId);
                if (!targetParent) return;

                const realChildren = Array.from(targetUl.children)
                    .filter(li => !li.dataset.placeholder);
                const newIndex = realChildren.indexOf(item);

                if (newIndex === -1) {
                    saveAndRefresh();
                    return;
                }

                if (targetParent.id === nodeId) {
                    toast('❌ 不能将节点移动到自身');
                    saveAndRefresh();
                    return;
                }

                function checkDescendant(parent, childId) {
                    if (!parent.children) return false;
                    for (let c of parent.children) {
                        if (c.id === childId) return true;
                        if (checkDescendant(c, childId)) return true;
                    }
                    return false;
                }
                if (checkDescendant(node, targetParent.id)) {
                    toast('❌ 不能将节点移动到自己的子节点下');
                    saveAndRefresh();
                    return;
                }

                const oldParent = findParent(treeData, nodeId);
                if (!oldParent) return;

                if (oldParent.id === targetParent.id) {
                    const oldIndex = oldParent.children.findIndex(c => c.id === nodeId);
                    if (oldIndex !== -1 && oldIndex !== newIndex) {
                        const [removed] = oldParent.children.splice(oldIndex, 1);
                        oldParent.children.splice(newIndex, 0, removed);
                        saveData();
                        renderTree();
                        if (selectedNode) {
                            const refreshed = findNodeById(treeData, selectedNode.id);
                            if (refreshed) { selectedNode = refreshed; showTaxonContent(refreshed); } else { selectedNode = treeData;
                                showTaxonContent(treeData); }
                        }
                        toast('✅ 排序已更新');
                    }
                    return;
                }

                const oldIndex = oldParent.children.findIndex(c => c.id === nodeId);
                if (oldIndex === -1) return;
                const [movedNode] = oldParent.children.splice(oldIndex, 1);
                if (!targetParent.children) targetParent.children = [];
                targetParent.children.splice(newIndex, 0, movedNode);

                saveData();
                renderTree();
                expandPath(targetParent.id);
                selectNode(targetParent);
                showTaxonContent(targetParent);
                toast(`✅ 已将「${getDisplayName(movedNode)}」移动到「${getDisplayName(targetParent)}」`);
            }, 

            onDragEnter: function(evt) {
                const targetUl = evt.to;
                if (!targetUl) return;
                const placeholder = targetUl.querySelector('li[data-placeholder="true"]');
                if (placeholder) {
                    placeholder.style.borderColor = '#2c7a4a';
                    placeholder.style.background = '#e8f5e9';
                    placeholder.style.color = '#2c7a4a';
                    placeholder.style.transition = 'all 0.15s ease';
                }
            },

            onDragLeave: function(evt) {
                const targetUl = evt.to;
                if (!targetUl) return;
                const placeholder = targetUl.querySelector('li[data-placeholder="true"]');
                if (placeholder) {
                    placeholder.style.borderColor = '#d0d7de';
                    placeholder.style.background = '#fafbfc';
                    placeholder.style.color = '#aaa';
                }
            }
        });
        treeSortableInstances.push(sortable);
    });
}

        // ============================================================
        // 📋 主区域内容展示（含拖拽排序）
        // ============================================================

        function showTaxonContent(node) {
            const mainContent = document.getElementById('mainContent');
            const emptyState = document.getElementById('emptyState');
            if (!node || node.type !== 'taxon') {
                mainContent.style.display = 'none';
                emptyState.style.display = 'flex';
                return;
            }
            emptyState.style.display = 'none';
            mainContent.style.display = 'flex';

            const allChildren = node.children || [];
            const displayChildren = allChildren;
            const count = allChildren.filter(c => c.type !== 'content').length;

            const header = document.getElementById('mainHeader');
            header.innerHTML = `
                <h2>${node.name || '未命名'} <span class="count">${count} 个子项</span></h2>
                <div class="controls">
                    <div class="size-control">
                        <span style="font-size:0.75rem;color:#888;user-select:none;margin-right:2px;">小</span>
                        <input type="range" min="0" max="100" value="50" step="1" 
                            style="width:100px;vertical-align:middle;cursor:pointer;" />
                        <span style="font-size:0.75rem;color:#888;user-select:none;margin-left:2px;">大</span>
                    </div>
                    <button id="fontToggleBtn" class="btn-primary" onclick="toggleFont()" style="font-size:0.78rem;padding:4px 11px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;transition:all 0.12s;color:#333;display:inline-flex;align-items:center;gap:3px;border-color:var(--primary);color:var(--primary);font-weight:500;">
                        ☐ 衬线阅读模式
                    </button>
                    <div class="add-btns">
                        <button class="add-taxon" onclick="showAddTaxonModal(findNodeById(treeData, '${node.id}'))">＋ 子分类</button>
                        <button class="add-species" onclick="showAddSpeciesModal(findNodeById(treeData, '${node.id}'))">⚘︎ 物种</button>
                        <button class="add-content" onclick="showAddContentModal(findNodeById(treeData, '${node.id}'))">🗒︎ 笔记</button>
                    </div>
                </div>
            `;

            const slider = document.querySelector('.size-control input[type="range"]');
            if (slider) {
                // 读取存储的像素值 → 反推滑块位置
                let savedPx = localStorage.getItem('cardSize');
                let percent = 50; // 默认 50% → 190px
                if (savedPx) {
                    const px = parseInt(savedPx, 10);
                    if (!isNaN(px) && px >= 120 && px <= 400) {
                        // 线性反推：percent = (px - 120) / (400 - 120) * 100
                        percent = Math.round((px - 120) / (400 - 120) * 100);
                    } else {
                        // 兼容旧版 small/medium/large
                        if (savedPx === 'small') percent = 15;
                        else if (savedPx === 'medium') percent = 50;
                        else if (savedPx === 'large') percent = 80;
                    }
                } else {
                    // 兼容旧版 cardSizePercent（如果存在）
                    const oldPercent = localStorage.getItem('cardSizePercent');
                    if (oldPercent) {
                        const p = parseInt(oldPercent, 10);
                        if (!isNaN(p) && p >= 0 && p <= 100) percent = p;
                    }
                }

                // 保证在有效范围内
                percent = Math.min(100, Math.max(0, percent));
                slider.value = percent;
                applyCardSize(percent);

                slider.addEventListener('input', function() {
                    const val = parseInt(this.value, 10);
                    applyCardSize(val);
                });
            }

            const wrap = document.getElementById('mainContentWrap');
            cleanupBlobURLs(wrap);
            if (displayChildren.length === 0) {
                wrap.innerHTML = `
                    <div class="card-grid" id="sortableGrid_${node.id}">
                        <div class="card placeholder-card">
                            <div class="card-body" style="text-align:center;padding:16px;">
                                <div style="font-size:calc(2rem * var(--card-font-scale));rem;margin-bottom:6px;">∅</div>
                                <div style="font-size:calc(1rem * var(--card-font-scale));rem;">此分类群下暂无内容</div>
                                <div style="font-size:calc(0.8rem * var(--card-font-scale));;color:#bbb;margin-top:4px;">请在编辑模式下添加内容</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                let gridHtml = `<div class="card-grid" id="sortableGrid_${node.id}">`;
                for (let item of displayChildren) {
                    gridHtml += renderCard(item);
                }
                gridHtml += `</div>`;
                wrap.innerHTML = gridHtml;
            }

            initSortable(node.id);
            loadImageRefs(wrap);

            document.querySelectorAll('.node-label').forEach(el => el.classList.remove('selected'));
            const li = document.querySelector(`li[data-node-id="${node.id}"]`);
            if (li) { const lb = li.querySelector('.node-label'); if (lb) lb.classList.add('selected'); }
            selectedNode = node;

            updateEditButtons();
            updateFontToggleUI();
        }

        // ============================================================
        // 🃏 渲染卡片（支持分类群、物种、笔记，均显示图片）
        // ============================================================

        function renderCard(item) {
            const type = item.type;
            const typeBadge = getTypeBadgeClass(item);
            const displayName = getDisplayName(item);
            const hasPhoto = (item.photos && item.photos.length > 0);
            const firstPhoto = hasPhoto ? item.photos[0] : null;

            let extraClass = '';
            let bodyExtra = '';
            let subInfo = '';
            let clickHandler = '';
            let imgHtml = '';

            if (firstPhoto) {
                const src = firstPhoto.src || '';
                const caption = firstPhoto.caption || '';
                const isRef = firstPhoto.isImageRef || false;
                const uuid = firstPhoto.uuid || '';

                if (isRef && uuid) {
                    imgHtml =
                        `<img data-img-uuid="${uuid}" data-caption="${caption}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="${displayName}" loading="lazy" />`;
                } else if (src && (src.startsWith('data:') || src.startsWith('http') || src.startsWith('/'))) {
                    imgHtml =
                        `<img src="${src}" data-src="${src}" data-caption="${caption}" alt="${displayName}" loading="lazy" />`;
                } else {
                    imgHtml = '';
                }
            }

            if (type === 'content') {
                extraClass = 'content-card';
                bodyExtra = `<div class="content-html">${marked.parse(item.html || '')}</div>`;
                clickHandler = `showContentDetail(findNodeById(treeData, '${item.id}'))`;
            } else if (type === 'taxon') {
                const count = (item.children || []).filter(c => c.type !== 'content').length;
                subInfo = `<div class="sub">${count} 个子项 ${hasPhoto ? '· 🖼︎' : ''}</div>`;
                clickHandler = `showTaxonContent(findNodeById(treeData, '${item.id}'))`;
            } else if (type === 'species') {
                const latin = item.latinName || '';          // 只取拉丁学名
                const author = item.authors ? item.authors : '';
                const fallbackName = item.commonName || item.name || '';  // 备选显示名
                let latinDisplay = latin ? `<i>${latin}</i>` : fallbackName;  // 有拉丁名就斜体，否则显示普通名
                let authorDisplay = author ? ' ' + author : '';
                subInfo = `<div class="sub">${latinDisplay}${authorDisplay}${hasPhoto ? ' <span class="photo-count">· 📷︎ ' + item.photos.length + '张</span>' : ''}</div>`;
                clickHandler = `showSpeciesDetail(findNodeById(treeData, '${item.id}'))`;
            }

            const cardId = `card_${item.id}`;

            return `
                <div class="card ${extraClass}" id="${cardId}" data-node-id="${item.id}" data-type="${type}" onclick="${clickHandler}">
                    ${imgHtml}
                    <div class="card-body">
                        <div class="name">
                            ${displayName}
                            <span class="type-badge ${typeBadge}">${getTypeLabel(item)}</span>
                        </div>
                        ${subInfo}
                        ${bodyExtra}
                    </div>
                    <div class="card-actions">
                        <button onclick="event.stopPropagation(); openEditor(findNodeById(treeData, '${item.id}'))">✎</button>
                        <button class="del-btn" onclick="event.stopPropagation(); deleteNode('${item.id}')">✕</button>
                    </div>
                </div>
            `;
        }

        // ===== 卡片尺寸控制 =====
        function applyCardSize(percent) {
            const root = document.documentElement;
            percent = Math.min(100, Math.max(0, percent));

            const width = Math.round(120 + (percent / 100) * (400 - 120));
            const imgHeight = Math.round(70 + (percent / 100) * (235 - 70));
            const padding = Math.round(8 + (percent / 100) * (20 - 8));

            // 字体缩放因子
            const fontScale = 0.9 + (percent / 100) * 0.2;

            root.style.setProperty('--card-min', width + 'px');
            root.style.setProperty('--card-img-height', imgHeight + 'px');
            root.style.setProperty('--card-padding', padding + 'px');
            root.style.setProperty('--card-font-scale', fontScale.toFixed(2));  // 保留两位小数

            localStorage.setItem('cardSize', String(width));
            localStorage.removeItem('cardSizePercent');
        }

        // ============================================================
        // 🔄 Sortable 拖拽初始化（卡片）
        // ============================================================

        function initSortable(parentId) {
            sortableInstances.forEach(s => s.destroy());
            sortableInstances = [];

            const grid = document.getElementById(`sortableGrid_${parentId}`);
            if (!grid) return;

            const sortable = new Sortable(grid, {
                animation: 200,
                draggable: '.card:not(.placeholder-card)',
                handle: '.card',
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                dragClass: 'sortable-drag',
                delay: 100,
                delayOnTouchOnly: true,
                disabled: !isEditMode,

                onEnd: function(evt) {
                    const items = grid.querySelectorAll('.card:not(.placeholder-card)');
                    const newOrder = [];
                    for (let el of items) {
                        const id = el.dataset.nodeId;
                        if (id) newOrder.push(id);
                    }
                    const parent = findNodeById(treeData, parentId);
                    if (!parent) return;
                    const newChildren = [];
                    for (let id of newOrder) {
                        const found = parent.children.find(c => c.id === id);
                        if (found) newChildren.push(found);
                    }
                    for (let c of parent.children) {
                        if (!newChildren.find(n => n.id === c.id)) {
                            newChildren.push(c);
                        }
                    }
                    parent.children = newChildren;
                    saveData();
                    showTaxonContent(parent);
                    selectNode(parent);
                    toast('✅ 排序已保存');
                }
            });

            sortableInstances.push(sortable);
        }

        // ============================================================
        // 🔍 搜索
        // ============================================================

        function rebuildSearchIndex() {
            allNodes = getAllNodes(treeData);
        }

        function setupSearch() {
            const input = document.getElementById('searchInput');
            const suggestions = document.getElementById('searchSuggestions');

        function getSearchScore(match, query, node) {
            const text = (match.text || '').toLowerCase();
            let score = 0;

            // 1. 完整匹配（最高优先级）
            if (text === query) {
                score += 1000;
            }

            // 2. 分类阶元优先（适用于模糊搜索）
            if (node.type === 'taxon') {
                score += 100;
            }

            // 3. 匹配类型权重
            switch (match.type) {
                case 'name':
                    score += 80;      // 分类群名称
                    break;
                case 'latinName':
                    score += 70;      // 物种当前拉丁学名
                    break;
                case 'commonName':
                    score += 50;      // 中文俗名
                    break;
                case 'synonym':
                    score += 20;      // 异名
                    break;
                default:
                    score += 10;
            }

            // 4. 开头匹配优于中间包含
            if (text.startsWith(query)) {
                score += 30;
            }

            return score;
        }

        input.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            if (!query) { suggestions.classList.remove('active'); return; }

            // ----- 匹配阶段：记录所有匹配项 -----
            const matches = [];
            for (const item of allNodes) {
                const node = item.node;
                const found = [];

                // 1. 中文俗名
                if (node.commonName && node.commonName.toLowerCase().includes(query)) {
                    found.push({ type: 'commonName', text: node.commonName });
                }

                // 2. 拉丁学名
                if (node.latinName && node.latinName.toLowerCase().includes(query)) {
                    found.push({ type: 'latinName', text: node.latinName });
                }

                // 3. 异名（每个异名单独作为一条匹配）
                if (node.synonyms && node.synonyms.length) {
                    for (const syn of node.synonyms) {
                        if (syn.toLowerCase().includes(query)) {
                            found.push({ type: 'synonym', text: syn });
                        }
                    }
                }

                // 4. 通用名称（name）
                if (node.name && node.name.toLowerCase().includes(query)) {
                    found.push({ type: 'name', text: node.name });
                }

                // 如果有匹配，计算该节点的最高分
                if (found.length > 0) {
                    let bestScore = -Infinity;
                    for (const m of found) {
                        const score = getSearchScore(m, query, node);
                        if (score > bestScore) bestScore = score;
                    }
                    matches.push({
                        node: node,
                        matches: found,
                        score: bestScore
                    });
                }
            }

            // ----- 排序：按分数降序，同分按名称字母升序 -----
            matches.sort((a, b) => {
                if (a.score !== b.score) return b.score - a.score;
                return getDisplayName(a.node).localeCompare(getDisplayName(b.node));
            });

            // ----- 渲染建议列表（与之前相同，仅适配 matches 结构） -----
            if (matches.length === 0) {
                suggestions.innerHTML = '<div class="suggestion-item" style="color:#888;">无匹配结果</div>';
            } else {
                let html = '';
                const maxShow = Math.min(matches.length, 25);
                for (let i = 0; i < maxShow; i++) {
                    const { node, matches: matchList } = matches[i];
                    const typeLabel = getTypeLabel(node);
                    const badgeClass = node.type === 'species' ? 'species' : 'taxon';
                    const displayName = getDisplayName(node);

                    let nameHtml = displayName;
                    if (node.type === 'species' && node.latinName) {
                        nameHtml += ` <span class="search-latin">${node.latinName}</span>`;
                    }

                    let extraHtml = '';
                    for (const m of matchList) {
                        if (m.type === 'synonym') {
                            extraHtml += `
                                <div class="search-match-hint">
                                    <span class="synonym-icon">[异名]</span> ${m.text}
                                </div>
                            `;
                        }
                        // 可扩展其他类型提示
                    }

                    html += `
                        <div class="suggestion-item" data-node-id="${node.id}">
                            <span>
                                ${nameHtml}
                                ${extraHtml}
                            </span>
                            <span class="badge ${badgeClass}">${typeLabel}</span>
                        </div>
                    `;
                }
                suggestions.innerHTML = html;
            }

            suggestions.classList.add('active');
        });

            suggestions.addEventListener('click', function(e) {
                const item = e.target.closest('.suggestion-item');
                if (!item) return;
                const nodeId = item.dataset.nodeId;
                const node = findNodeById(treeData, nodeId);
                if (!node) return;
                suggestions.classList.remove('active');
                input.value = '';
                // 统一使用 jumpToNode
                jumpToNode(node);
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('.search-container')) suggestions.classList.remove('active');
            });
        }

        function expandPath(nodeId) {
            const node = findNodeById(treeData, nodeId);
            if (!node) return;
            const path = [];
            let current = node;
            while (current) {
                path.unshift(current);
                const parent = findParent(treeData, current.id);
                current = parent;
            }
            for (let n of path) {
                if (n.type === 'taxon' && n.children && n.children.length) {
                    const li = document.querySelector(`li[data-node-id="${n.id}"]`);
                    if (li) {
                        const cd = li.querySelector(':scope > .children-container');
                        const lb = li.querySelector(':scope > .node-label');
                        if (cd && !cd.classList.contains('open')) { cd.classList.add('open'); if (lb) lb.classList.add(
                                'expanded'); }
                    }
                }
            }
            const targetLi = document.querySelector(`li[data-node-id="${nodeId}"]`);
            if (targetLi) {
                targetLi.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        }

        function selectNode(node) {
            selectedNode = node;
            document.querySelectorAll('.node-label').forEach(el => el.classList.remove('selected'));
            const li = document.querySelector(`li[data-node-id="${node.id}"]`);
            if (li) { const lb = li.querySelector('.node-label'); if (lb) lb.classList.add('selected'); }
        }

        function selectNodeById(id) {
            const node = findNodeById(treeData, id);
            if (node) selectNode(node);
            return node;
        }

        function jumpToNode(node) {
            if (!node) return;

            expandPath(node.id);
            selectNode(node);
            
            if (node.type === 'species') {
                showSpeciesDetail(node);
            } else if (node.type === 'content') {
                showContentDetail(node);
            } else {
                showTaxonContent(node);
            }

            highlightNode(node.id);
        }

        function highlightNode(id) {
            if (highlightTimer) {
                clearTimeout(highlightTimer);
            }

            document.querySelectorAll('.node-label.highlight')
                .forEach(el => el.classList.remove('highlight'));

            const li = document.querySelector(`li[data-node-id="${id}"]`);
            const lb = li?.querySelector('.node-label');

            if (lb) {
                lb.classList.add('highlight');

                highlightTimer = setTimeout(() => {
                    lb.classList.remove('highlight');
                    highlightTimer = null;
                }, 2000);
            }
        }

        function toggleFont() {
            const body = document.body;
            body.classList.toggle('serif-mode');
            updateFontToggleUI();   // 更新按钮文字
            localStorage.setItem('fontMode', body.classList.contains('serif-mode') ? 'serif' : 'sans');
        }

        function applyFontPreference() {
            const saved = localStorage.getItem('fontMode');
            if (saved === 'serif') {
                document.body.classList.add('serif-mode');
            } else {
                document.body.classList.remove('serif-mode');
            }
        }

        function updateFontToggleUI() {
            const btn = document.getElementById('fontToggleBtn');
            if (!btn) return;
            const isSerif = document.body.classList.contains('serif-mode');
            btn.textContent = isSerif ? '☑ 衬线阅读模式' : '☐ 衬线阅读模式';
        }

        // ============================================================
        // ✏️ 编辑模式
        // ============================================================

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('editToggleBtn');
            if (isEditMode) {
                btn.classList.add('active');
                btn.textContent = '☑ 编辑模式';
                document.body.classList.add('edit-mode');
                localStorage.setItem('editMode', 'true');
            } else {
                btn.classList.remove('active');
                btn.textContent = '✎ 编辑模式';
                document.body.classList.remove('edit-mode');
                localStorage.setItem('editMode', 'false');
            }
            treeSortableInstances.forEach(s => s.option('disabled', !isEditMode));
            updateEditButtons();
            if (selectedNode) {
                showTaxonContent(selectedNode);
            }
        }
        
        function updateEditButtons() {
            document.querySelectorAll('.node-actions').forEach(el => {
                el.style.display = isEditMode ? 'flex' : 'none';
            });
            document.querySelectorAll('.card-actions').forEach(el => {
                el.style.display = isEditMode ? 'flex' : 'none';
            });
            const addBtns = document.querySelectorAll('.add-btns');
            addBtns.forEach(el => { el.style.display = isEditMode ? 'flex' : 'none'; });
        }

        // ============================================================
        // 🖼 图片列表排序功能（模态框内）—— 使用 setImageBlob 管理 ObjectURL
        // ============================================================

        function initImageSortable(modalElement) {
            const textareas = modalElement.querySelectorAll('textarea[data-image-field="true"]');
            
            textareas.forEach(textarea => {
                const fieldId = textarea.id;
                
                // 创建预览容器（每个 textarea 对应一个容器）
                const container = document.createElement('div');
                container.className = 'image-sortable-list';
                container.id = 'preview_' + fieldId;
                textarea.parentNode.insertBefore(container, textarea.nextSibling);

                // ===== 核心渲染函数 =====
                function renderPreview() {
                    // ---------- 第1步：销毁旧的 Sortable 实例 ----------
                    if (container._sortableInstance) {
                        container._sortableInstance.destroy();
                        container._sortableInstance = null;
                    }

                    // ---------- 第2步：清理容器内所有图片的 ObjectURL ----------
                    const oldImages = container.querySelectorAll('.img-preview');
                    oldImages.forEach(img => {
                        if (img._blobURL) {
                            URL.revokeObjectURL(img._blobURL);
                            img._blobURL = null;
                        }
                    });

                    // ---------- 第3步：解析数据 ----------
                    const images = parseImageField(textarea.value);
                    
                    // 清空容器
                    container.innerHTML = '';

                    // 如果无图片，显示占位提示
                    if (images.length === 0) {
                        container.innerHTML = `
                            <div style="color:#bbb;text-align:center;padding:8px;font-size:0.8rem;">
                                暂无图片，请在上方输入或粘贴
                            </div>
                        `;
                        return;
                    }

                    // ---------- 第4步：渲染每个图片项 ----------
                    images.forEach((img, index) => {
                        const item = document.createElement('div');
                        item.className = 'image-item';
                        item.dataset.index = index;

                        const isRef = img.src.startsWith('[img:');
                        const previewSrc = isRef 
                            ? 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7' 
                            : img.src;

                        item.innerHTML = `
                            <span class="drag-handle">⠿</span>
                            <img class="img-preview" src="${previewSrc}" alt="预览" onerror="this.style.display='none'" />
                            <span class="img-info">
                                <span>${img.src.length > 40 ? img.src.slice(0,40) + '…' : img.src}</span>
                                <span class="caption">${img.caption || ''}</span>
                            </span>
                            <span class="img-remove" title="移除">✕</span>
                        `;

                        // 如果是 IndexedDB 引用，异步加载真实图片
                        if (isRef) {
                            const uuid = img.src.replace('[img:', '').replace(']', '');
                            const preview = item.querySelector('.img-preview');
                            if (preview) {
                                getImageFromDB(uuid)
                                    .then(blob => {
                                        if (blob) {
                                            setImageBlob(preview, blob);
                                        } else {
                                            setImageBlob(preview, null);
                                        }
                                    })
                                    .catch(() => {
                                        setImageBlob(preview, null);
                                    });
                            }
                        }

                        // 删除按钮事件
                        item.querySelector('.img-remove').addEventListener('click', function(e) {
                            e.stopPropagation();
                            const idx = parseInt(item.dataset.index);
                            const lines = textarea.value.split('\n').filter(s => s.trim());
                            lines.splice(idx, 1);
                            textarea.value = lines.join('\n');
                            textarea.dispatchEvent(new Event('input'));
                            // input 事件会自动触发 renderPreview
                        });

                        container.appendChild(item);
                    });

                    // ---------- 第5步：创建新的 Sortable 实例 ----------
                    if (window.Sortable) {
                        container._sortableInstance = new Sortable(container, {
                            animation: 150,
                            handle: '.drag-handle',
                            ghostClass: 'sortable-ghost',
                            chosenClass: 'sortable-chosen',
                            dragClass: 'sortable-drag',

                            onEnd: function(evt) {
                                // ===== 性能优化：只 split 一次 =====
                                const lines = textarea.value.split('\n').filter(s => s.trim());
                                const items = container.querySelectorAll('.image-item');
                                const newOrder = [];

                                items.forEach(el => {
                                    const idx = parseInt(el.dataset.index);
                                    if (idx < lines.length) {
                                        newOrder.push(lines[idx]);
                                    }
                                });

                                textarea.value = newOrder.join('\n');
                                textarea.dispatchEvent(new Event('input'));
                                // input 事件会自动触发 renderPreview，实现 UI 刷新
                            }
                        });
                    }
                }

                // 监听输入变化，实时预览
                textarea.addEventListener('input', renderPreview);
                // 首次渲染
                renderPreview();
            });
        }

        // ============================================================
        // 📋 剪贴板粘贴图片（存入 IndexedDB）
        // ============================================================

        async function pasteImageFromClipboard(textareaId) {
            const textarea = document.getElementById(textareaId);
            if (!textarea) return;

            try {
                if (!navigator.clipboard || !navigator.clipboard.read) {
                    toast('❌ 当前浏览器不支持剪贴板读取，请使用文件选择或URL');
                    return;
                }
                const items = await navigator.clipboard.read();
                let imageBlob = null;
                for (let item of items) {
                    if (item.types.some(t => t.startsWith('image/'))) {
                        const type = item.types.find(t => t.startsWith('image/'));
                        imageBlob = await item.getType(type);
                        break;
                    }
                }
                if (!imageBlob) {
                    toast('❌ 剪贴板中没有图片数据');
                    return;
                }

                const compressedBlob = await compressImage(imageBlob, 1024, 0.8);
                const uuid = generateUUID();
                await saveImageToDB(uuid, compressedBlob);

                const current = textarea.value;
                const newLine = current ? '\n' : '';
                textarea.value = current + newLine + `[img:${uuid}]|粘贴图片（压缩后）`;
                textarea.dispatchEvent(new Event('input'));
                toast('✅ 图片已存入 IndexedDB，请添加说明文字');
            } catch (err) {
                console.error(err);
                toast('❌ 读取剪贴板失败: ' + err.message);
            }
        }

        // 辅助：压缩图片（返回 Blob）
        function compressImage(blob, maxSize, quality) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(blob);
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width,
                        h = img.height;
                    if (w > maxSize || h > maxSize) {
                        if (w > h) { h = h * maxSize / w;
                            w = maxSize; } else { w = w * maxSize / h;
                            h = maxSize; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(blob) {
                        resolve(blob);
                    }, 'image/jpeg', quality);
                    URL.revokeObjectURL(url);
                };
                img.onerror = function() {
                    URL.revokeObjectURL(url);
                    reject('图片加载失败');
                };
                img.src = url;
            });
        }

        // ============================================================
        // 🧩 parseImageField（支持 [img:uuid] 标记）
        // ============================================================

        /**
         * 将图片字段文本解析为对象数组
         * 每行格式：URL|caption 或 [img:uuid]|caption
         */
        function parseImageField(text) {
            const lines = text.split('\n').filter(s => s.trim());
            return lines.map(line => {
                const parts = line.split('|');
                let src = parts[0].trim();
                let caption = parts[1] ? parts[1].trim() : '';
                const isRef = src.startsWith('[img:');
                let uuid = '';
                if (isRef) {
                    uuid = src.replace('[img:', '').replace(']', '');
                }
                return { src, caption, isImageRef: isRef, uuid: uuid };
            });
        }

        function validateTaxonName(parent, name, excludeId) {
            const trimmed = name.trim();
            if (!trimmed) {
                return { valid: false, message: '⚠️ 请输入分类群名称' };
            }
            if (parent.children) {
                for (let child of parent.children) {
                    if (child.id === excludeId) continue;
                    if (child.type === 'taxon' && child.name === trimmed) {
                        return { valid: false, message: '⚠️ 该分类群名称已存在，请勿重复' };
                    }
                }
            }
            return { valid: true };
        }

        function validateSpeciesName(parent, commonName, latinName, excludeId) {
            const cName = commonName.trim();
            const lName = latinName.trim();
            if (!cName && !lName) {
                return { valid: false, message: '⚠️ 请至少填写中文俗名或拉丁学名' };
            }
            if (parent.children) {
                for (let child of parent.children) {
                    if (child.id === excludeId) continue;
                    if (child.type === 'species') {
                        if (cName && child.commonName === cName) {
                            return { valid: false, message: '⚠️ 该中文俗名已存在，请勿重复' };
                        }
                        if (lName && child.latinName === lName) {
                            return { valid: false, message: '⚠️ 该拉丁学名已存在，请勿重复' };
                        }
                    }
                }
            }
            return { valid: true };
        }

        function collectAllPhotoUUIDs(node) {
            const uuids = [];
            if (node.photos) {
                for (let p of node.photos) {
                    if (p.isImageRef && p.uuid) {
                        uuids.push(p.uuid);
                    }
                }
            }
            if (node.children) {
                for (let child of node.children) {
                    uuids.push(...collectAllPhotoUUIDs(child));
                }
            }
            return uuids;
        }

        function deleteNode(nodeId) {
            const node = findNodeById(treeData, nodeId);
            if (!node) return;
            const parent = findParent(treeData, nodeId);
            if (!parent) return;
            const name = getDisplayName(node);
            if (!confirm(`确定要删除「${name}」及其所有子项吗？\n（关联的图片也会被删除）`)) return;

            const uuids = collectAllPhotoUUIDs(node);
            if (uuids.length > 0) {
                Promise.all(uuids.map(uuid => deleteImageFromDB(uuid).catch(() => {})))
                    .then(() => {
                        console.log(`🗑 已删除 ${uuids.length} 张关联图片`);
                    })
                    .catch(() => {});
            }

            parent.children = parent.children.filter(c => c.id !== nodeId);
            saveAndRefresh();
            toast(`🗑 已删除「${name}」及 ${uuids.length} 张图片`);

                showTaxonContent(parent); } else if (selectedNode) { showTaxonContent(selectedNode); } else { showTaxonContent(
                    treeData); }

                    const placeholder = f.placeholder || '';
                    const rows = f.rows || 3;
                    const withPaste = f.withPaste || false;
                    const isImageField = f.isImageField || false;
                    let pasteBtn = '';
                    if (withPaste) {
                        pasteBtn = `
                            <div class="paste-area">
                                <button class="paste-btn" onclick="pasteImageFromClipboard('modal_${f.id}')">📋 从剪贴板粘贴图片</button>
                                <span style="font-size:0.75rem;color:#999;">（将自动压缩并存入 IndexedDB）</span>
                            </div>
                        `;
                    }
                    let imageFieldAttr = isImageField ? ' data-image-field="true"' : '';
                    if (f.type === 'textarea') {
                        fieldsHTML += `
                            <div class="form-group">
                                <label>${f.label}</label>
                                <textarea id="modal_${f.id}" placeholder="${placeholder}" rows="${rows}"${imageFieldAttr}>${val}</textarea>
                                ${pasteBtn}
                            </div>
                        `;
                    } else {
                        fieldsHTML += `
                            <div class="form-group">
                                <label>${f.label}</label>
                                <input type="text" id="modal_${f.id}" placeholder="${placeholder}" value="${val}" />
                            </div>
                        `;
                    }
                }
            }

            let contentHTML = options.content || '';

            cleanupBlobURLs(body);
            body.innerHTML = `
                <div class="modal-header">
                    <h2>${options.title || '编辑'}</h2>
                </div>
                <div class="modal-body">
                    ${fieldsHTML}
                    ${contentHTML}
                </div>
                ${options.hideFooter ? '' : `
                <div class="modal-footer">
                    <button class="btn-cancel" onclick="tryCloseModal(document.getElementById('genericModal'))">取消</button>
                    <button class="btn-save" id="modalSaveBtn">💾︎ 保存</button>
                </div>
                `}
            `;

            overlay.classList.add('active');
            overlay._dirty = false;

            // 给所有输入框绑定 input 事件（检测用户是否修改过内容）
            body.querySelectorAll('input, textarea, select').forEach(el => {
                ['input', 'change'].forEach(type => {
                    el.addEventListener(type, function onInput() {
                        overlay._dirty = true;
                    });
                });
            });

            if (!options.hideFooter) {
                setTimeout(() => {
                    initImageSortable(document.getElementById('modalContainer'));
                }, 50);
            };

            if (!options.hideFooter) {
                document.getElementById('modalSaveBtn').onclick = function() {
                    const data = {};
                    if (options.fields) {
                        for (let f of options.fields) {
                            const el = document.getElementById('modal_' + f.id);
                            if (el) data[f.id] = el.value;
                        }
                    }
                    if (options.onSave) {
                        const result = options.onSave(data);
                        if (result !== false) {
                            overlay._dirty = false;
                            closeModal();
                        }
                        // result === false 时不关闭
                    } else {
                        overlay._dirty = false;
                        closeModal();
                    }
                };
            }

            document.getElementById('modalCloseBtn').onclick = function() {
                tryCloseModal(overlay);
                if (options.onClose) options.onClose();
            };

            overlay.onclick = null;
            if (options.allowOverlayClose) {
                overlay.onclick = function(e) {
                    if (e.target === overlay) {
                        tryCloseModal(overlay);
                        if (options.onClose) options.onClose();
                    }
                };
            }
        }

            function tryCloseModal(overlay) {
                if (!overlay) {
                    overlay = document.getElementById('genericModal');
                    if (!overlay || !overlay.classList.contains('active')) return;
                }
                if (!overlay._dirty) {
                    closeModal();
                    return;
                }
                if (confirm('当前修改尚未保存，确定放弃吗？')) {
                    closeModal();
                }
            }

        function closeModal() {
            const overlay = document.getElementById('genericModal');
            if (!overlay) return;

            // ---------- 清理所有图片排序容器 ----------
            const containers = overlay.querySelectorAll('.image-sortable-list');
            containers.forEach(container => {
                //销毁 Sortable 实例
                if (container._sortableInstance) {
                    container._sortableInstance.destroy();
                    container._sortableInstance = null;
                }
                cleanupBlobURLs(container);
                //清空容器内容
                container.innerHTML = '';
            });

            // ---------- 关闭模态框 ----------
            overlay.classList.remove('active');
        }

        // ============================================================
        // 💾 数据持久化（统一版本管理）
        // ============================================================

        function saveData() {
            // 确保 treeData 中有版本号
            if (treeData) {
                treeData.version = CURRENT_VERSION;
            }
            localStorage.setItem('taxonomyNotesData', JSON.stringify(treeData));
            // 不再单独存储 idCounter，使用 rebuildIdCounter 恢复
        }

        function loadData() {
            const saved = localStorage.getItem('taxonomyNotesData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // 确保版本存在，若无则设为 '1.0'，然后迁移
                    if (!parsed.version) {
                        parsed.version = '1.0';
                    }
                    // 迁移数据（兼容旧版）
                    parsed.version = migrateData(parsed);
                    treeData = parsed;
                    // 重建 idCounter（不依赖 localStorage）
                    idCounter = rebuildIdCounter(treeData);
                    return true;
                } catch (e) {
                    console.warn('数据加载失败，将使用默认数据', e);
                }
            }
            return false;
        }

        // ===== 版本迁移系统（P0-1 改进） =====
        function migrateData(data) {
            const version = data.version || '1.0';
            let migrated = data;

            // ---- 未来迁移规则（留空） ----
            // if (version === '1.0') { ... 迁移到 1.2 }
            // if (version === '1.2') { ... 迁移到 2.0 }
            // ... 更多迁移

            // 当前所有版本都执行字段补全（向下兼容）
            migrated = ensureAllFields(migrated);

            // 更新版本号为最新
            migrated.version = CURRENT_VERSION;
            return migrated.version; // 返回最新版本
        }

        // 补全缺失字段（确保所有节点结构完整）
        function ensureAllFields(data) {
            function walk(node) {
                if (!node) return;
                node.photos ||= [];
                node.children ||= [];
                node.type ||= 'taxon';

                if (node.type === 'species') {
                    node.commonName ||= '';
                    node.latinName ||= '';
                    node.authors ||= '';
                    node.distribution ||= '';
                    node.habitat ||= '';
                    node.synonyms ||= [];
                    node.diagnosis ||= '';
                    node.description ||= '';
                    node.discussion ||= '';
                    node.references ||= [];
                }
                if (node.type === 'content') {
                    node.html ||= '';
                }
                if (node.type === 'taxon') {
                    node.name ||= '未命名分类群';
                }

                if (node.children) {
                    for (let child of node.children) {
                        walk(child);
                    }
                }
            }
            walk(data);
            return data;
        }

        function saveAndRefresh() {
            saveData();
            renderTree();
            if (selectedNode) {
                const refreshed = findNodeById(treeData, selectedNode.id);
                if (refreshed) { selectedNode = refreshed;
                    showTaxonContent(refreshed); } else { selectedNode = treeData;
                    showTaxonContent(treeData); }
            }
        }

        // ============================================================
        // 📤 导入导出（含 IndexedDB 图片 + UUID 冲突处理 + 版本兼容）
        // ============================================================

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.treeData || !data.treeData.id) {
                        toast('❌ 无效的数据格式：缺少 treeData');
                        return;
                    }

                    // ---- 版本迁移 ----
                    let importedTree = data.treeData;
                    if (!importedTree.version) importedTree.version = '1.0';
                    const newVersion = migrateData(importedTree);
                    importedTree.version = newVersion; // 更新为最新

                    // ---- UUID 冲突处理 ----
                    let existingUUIDs = new Set();
                    try {
                        const existing = await getAllImagesFromDB();
                        existingUUIDs = new Set(existing.map(entry => entry.id));
                    } catch (err) {
                        console.warn('获取已有图片列表失败', err);
                    }

                    const conflictMap = {};
                    const imageEntries = data.images || {};
                    for (let [uuid, base64] of Object.entries(imageEntries)) {
                        if (existingUUIDs.has(uuid)) {
                            const newUuid = generateUUID();
                            conflictMap[uuid] = newUuid;
                            console.log(`⚠️ UUID 冲突: ${uuid} -> ${newUuid}`);
                        }
                    }

                    if (Object.keys(conflictMap).length > 0) {
                        const jsonStr = JSON.stringify(importedTree);
                        let updatedStr = jsonStr;
                        for (let [oldUuid, newUuid] of Object.entries(conflictMap)) {
                            updatedStr = updatedStr.split(`[img:${oldUuid}]`).join(`[img:${newUuid}]`);
                        }
                        importedTree = JSON.parse(updatedStr);
                        toast(`🔄 检测到 ${Object.keys(conflictMap).length} 个UUID冲突，已自动重新生成`);
                    }

                    // ---- 恢复图片到 IndexedDB ----
                    let savedCount = 0;
                    for (let [uuid, base64] of Object.entries(imageEntries)) {
                        try {
                            const finalUuid = conflictMap[uuid] || uuid;
                            const response = await fetch(base64);
                            const blob = await response.blob();
                            await saveImageToDB(finalUuid, blob);
                            savedCount++;
                        } catch (err) {
                            console.warn('图片恢复失败', uuid, err);
                        }
                    }

                    // ---- 更新数据 ----
                    treeData = importedTree;
                    // 重建 idCounter
                    idCounter = rebuildIdCounter(treeData);

                    saveData();
                    selectedNode = treeData;
                    renderTree();
                    showTaxonContent(treeData);

                    // 更新最后导出时间（导入也算一次安全操作）
                    localStorage.setItem('lastExportTime', Date.now().toString());

                    toast(`✅ 导入成功！版本 ${data.version || '1.0'} → ${importedTree.version}，恢复 ${savedCount} 张图片`);
                } catch (err) {
                    console.error('导入失败:', err);
                    toast('❌ 导入失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        // 📤 导出（统一使用 treeData.version）
        // ============================================================

        async function exportData() {
            try {
                const allImages = await getAllImagesFromDB();
                const imageMap = {};
                for (let entry of allImages) {
                    try {
                        const base64 = await blobToBase64(entry.blob);
                        imageMap[entry.id] = base64;
                    } catch (e) {
                        console.warn('图片转换失败', entry.id, e);
                    }
                }
                // 使用 treeData.version 作为导出版本
                const exportVersion = treeData.version || CURRENT_VERSION;
                const exportObj = {
                    treeData: treeData,
                    images: imageMap,
                    version: exportVersion
                };
                const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `分类学笔记_${new Date().toISOString().slice(0,10)}.json`;
                a.click();

                // 记录导出时间
                localStorage.setItem('lastExportTime', Date.now().toString());
                toast(`📥 数据已导出（版本 ${exportVersion}，含 ${Object.keys(imageMap).length} 张图片）`);

                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            } catch (err) {
                console.error(err);
                toast('❌ 导出失败: ' + err.message);
            }
        }

        // ============================================================
        // 🔄 重置
        // ============================================================

        function resetAll() {
            if (!confirm('⚠️ 确定要重置所有数据吗？此操作不可撤销！')) return;
            treeData = deepClone(DEFAULT_DATA);
            treeData.version = CURRENT_VERSION;
            selectedNode = treeData;
            idCounter = 1000;
            saveData();
            getAllImagesFromDB().then(entries => {
                for (let entry of entries) {
                    deleteImageFromDB(entry.id).catch(() => {});
                }
            }).catch(() => {});
            renderTree();
            showTaxonContent(treeData);
            toast('🗑 已重置所有数据');
        }

        // ============================================================
        // 📐 左栏宽度拖拽
        // ============================================================

        function setupSidebarResizer() {
            const resizer = document.getElementById('sidebarResizer');
            const sidebar = document.getElementById('sidebar');
            let isResizing = false;

            resizer.addEventListener('mousedown', function(e) {
                isResizing = true;
                resizer.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onResize);
                document.addEventListener('mouseup', onResizeEnd);
                e.preventDefault();
            });

            function onResize(e) {
                if (!isResizing) return;
                const rect = sidebar.getBoundingClientRect();
                const newWidth = e.clientX - rect.left;
                if (newWidth >= 180 && newWidth <= 600) {
                    sidebar.style.width = newWidth + 'px';
                    document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
                }
            }

            function onResizeEnd() {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onResize);
                document.removeEventListener('mouseup', onResizeEnd);
                const w = sidebar.style.width;
                if (w) localStorage.setItem('sidebarWidth', w);
            }

            const savedWidth = localStorage.getItem('sidebarWidth');
            if (savedWidth) {
                const w = parseInt(savedWidth);
                if (w >= 180 && w <= 600) {
                    sidebar.style.width = w + 'px';
                    document.documentElement.style.setProperty('--sidebar-width', w + 'px');
                }
            }
        }

        // ============================================================
        // 📢 Toast（支持样式扩展）
        // ============================================================

        let toastTimer = null;

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            el.classList.remove('warning', 'info');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ============================================================
        // 🧩 全局异常处理
        // ============================================================

        function setupGlobalErrorHandling() {
            window.onerror = function(message, source, lineno, colno, error) {
                console.error('【全局错误】', message, source, lineno, colno, error);
                toast('⚠️ 发生未知错误，请按 F12 查看控制台详情');
                try {
                    const log = JSON.parse(localStorage.getItem('errorLog') || '[]');
                    log.push({
                        time: new Date().toISOString(),
                        message: String(message),
                        source: source || '',
                        lineno: lineno || 0,
                        colno: colno || 0,
                        stack: error ? error.stack : ''
                    });
                    if (log.length > 50) log.shift();
                    localStorage.setItem('errorLog', JSON.stringify(log));
                } catch (e) { /* 忽略日志写入错误 */ }
                return true;
            };

            window.onunhandledrejection = function(event) {
                console.error('【未处理的Promise拒绝】', event.reason);
                toast('⚠️ 发生异步错误，请按 F12 查看控制台详情');
                try {
                    const log = JSON.parse(localStorage.getItem('errorLog') || '[]');
                    log.push({
                        time: new Date().toISOString(),
                        type: 'unhandledrejection',
                        reason: String(event.reason)
                    });
                    if (log.length > 50) log.shift();
                    localStorage.setItem('errorLog', JSON.stringify(log));
                } catch (e) { /* 忽略 */ }
                event.preventDefault();
            };

            window.addEventListener('error', function(e) {
                if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'SCRIPT')) {
                    console.warn('资源加载失败:', e.target.src || e.target.href);
                    return;
                }
                if (!e.message) return;
                toast('⚠️ 页面发生错误，请查看控制台');
            }, true);
        }

        // ============================================================
        // 📌 备份提醒（P0-2 改进：首次启动用模态框）
        // ============================================================

        let backupCheckDone = false;

        function checkBackupReminder() {
            if (backupCheckDone) return;
            backupCheckDone = true;

            const hasSeenWelcome = localStorage.getItem('hasSeenWelcome');
            if (!hasSeenWelcome) {
                // 第一次启动：弹模态框
                showModal({
                    title: '欢迎使用 DHI 分类学笔记！',
                    content: `
                        <p style="font-size:1rem;line-height:1.8;">
                            数据保存在本地浏览器中，<strong>请定期导出 JSON 备份</strong>，以防缓存清理导致数据丢失。
                        </p>
                        <p style="margin-top:12px;color:#666;">
                            建议每次重要更新后点击「导出JSON」保存。
                        </p>
                        <div style="margin-top:20px;text-align:center;">
                            <button class="btn-save" onclick="closeModal();" style="font-size:1rem;padding:8px 32px;">知道了</button>
                        </div>
                    `,
                    hideFooter: true,
                    allowOverlayClose: true
                });
                localStorage.setItem('hasSeenWelcome', 'true');
                localStorage.setItem('lastBackupCheck', Date.now().toString());
                return;
            }

            // 非首次：检查是否超过7天未备份
            const lastExport = localStorage.getItem('lastExportTime');
            if (lastExport) {
                const days = (Date.now() - parseInt(lastExport)) / (1000 * 60 * 60 * 24);
                if (days > 7) {
                    const toastEl = document.getElementById('toast');
                    toastEl.classList.add('warning');
                    toast('⚠️ 已超过7天未备份数据，建议点击「导出JSON」保存。');
                    setTimeout(() => {
                        toastEl.classList.remove('warning');
                    }, 4000);
                }
            } else {
                // 从未导出过，温和提醒
                const lastCheck = localStorage.getItem('lastBackupCheck');
                if (!lastCheck || (Date.now() - parseInt(lastCheck)) > 24 * 60 * 60 * 1000) {
                    toast('💡 提示：点击「导出JSON」可备份所有数据（含图片）');
                    localStorage.setItem('lastBackupCheck', Date.now().toString());
                }
            }
        }

        // ============================================================
        // 🚀 初始化
        // ============================================================

        function init() {
            setupGlobalErrorHandling();

            if (!loadData()) {
                treeData = deepClone(DEFAULT_DATA);
                treeData.version = CURRENT_VERSION;
                selectedNode = treeData;
                idCounter = 1000;
                saveData();
            } else {
                if (!treeData || !treeData.id) {
                    treeData = deepClone(DEFAULT_DATA);
                    treeData.version = CURRENT_VERSION;
                    saveData();
                }
                // 确保所有字段完整（兼容旧数据）
                ensureAllFields(treeData);
                // 确保版本号
                treeData.version = CURRENT_VERSION;
                saveData();
                selectedNode = treeData;
            }

            renderTree();
            applyFontPreference();
            showTaxonContent(treeData);
            setupSearch();
            setupLightbox();
            setupSidebarResizer();

            // 恢复卡片尺寸 —— 从像素值反推滑块位置
            let savedPx = localStorage.getItem('cardSize');
            let percent = 50; // 默认
            if (savedPx) {
                const px = parseInt(savedPx, 10);
                if (!isNaN(px) && px >= 120 && px <= 400) {
                    percent = Math.round((px - 120) / (400 - 120) * 100);
                } else {
                    // 兼容旧版 small/medium/large
                    if (savedPx === 'small') percent = 15;
                    else if (savedPx === 'medium') percent = 50;
                    else if (savedPx === 'large') percent = 80;
                }
            } else {
                // 兼容旧版 cardSizePercent（如果存在）
                const oldPercent = localStorage.getItem('cardSizePercent');
                if (oldPercent) {
                    const p = parseInt(oldPercent, 10);
                    if (!isNaN(p) && p >= 0 && p <= 100) percent = p;
                    localStorage.removeItem('cardSizePercent');
                }
            }
            percent = Math.min(100, Math.max(0, percent));
            applyCardSize(percent);

            // 同步更新滑块位置（如果当前有滑块）
            const slider = document.querySelector('.size-control input[type="range"]');
            if (slider) slider.value = percent;

            if (localStorage.getItem('editMode') === 'true') {
                setTimeout(() => { if (!isEditMode) toggleEditMode(); }, 100);
            }

            // ---- 备份提醒（首次弹模态框，后续 Toast） ----
            setTimeout(checkBackupReminder, 600);

            document.getElementById('modalCloseBtn').onclick = closeModal;
            document.getElementById('speciesModalClose').onclick = function() {
                document.getElementById('speciesModal').classList.remove('active');
            };
            document.getElementById('speciesModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });

            document.addEventListener('keydown', function(e) {

                // Ctrl/Cmd + E
                if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
                    e.preventDefault();
                    toggleEditMode();
                    return;
                }

                // ===== Ctrl+Shift+F 切换字体 =====
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'F') {
                    e.preventDefault();
                    toggleFont();
                    return;
                }

                if (lightboxState.isOpen) {
                    if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        prevImage();
                        return;
                    }
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        nextImage();
                        return;
                    }
                }

                if (e.key !== 'Escape') return;

                // Lightbox（最高层）
                const lightbox = document.getElementById('lightbox');
                if (lightbox?.classList.contains('active')) {
                    e.preventDefault();
                    closeLightbox();
                    return;
                }

                // Generic Modal（次高层）
                const genericModal = document.getElementById('genericModal');
                if (genericModal?.classList.contains('active')) {
                    e.preventDefault();
                    tryCloseModal(genericModal);   // 传入参数，明确关闭对象
                    return;
                }

                // Species Modal（底层）
                const speciesModal = document.getElementById('speciesModal');
                if (speciesModal?.classList.contains('active')) {
                    e.preventDefault();
                    speciesModal.classList.remove('active');
                    return;
                }
            });

            console.info("DHI Taxonomic Notebook v1.1.0");
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
