        // ============================================================
        // 💾 数据持久化（统一版本管理）
        // ============================================================

        function saveData() {
            // 确保 treeData 中有版本号
            if (treeData) {
                treeData.version = CURRENT_VERSION;
            }
            localStorage.setItem('taxonomyNotesData', JSON.stringify(treeData));
            // 不再单独存储 idCounter，使用 rebuildIdCounter 恢复
        }

        function loadData() {
            const saved = localStorage.getItem('taxonomyNotesData');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // 确保版本存在，若无则设为 '1.0'，然后迁移
                    if (!parsed.version) {
                        parsed.version = '1.0';
                    }
                    // 迁移数据（兼容旧版）
                    parsed.version = migrateData(parsed);
                    treeData = parsed;
                    // 重建 idCounter（不依赖 localStorage）
                    idCounter = rebuildIdCounter(treeData);
                    return true;
                } catch (e) {
                    console.warn('数据加载失败，将使用默认数据', e);
                }
            }
            return false;
        }

        // ===== 版本迁移系统（P0-1 改进） =====
        function migrateData(data) {
            const version = data.version || '1.0';
            let migrated = data;

            // ---- 未来迁移规则（留空） ----
            // if (version === '1.0') { ... 迁移到 1.2 }
            // if (version === '1.2') { ... 迁移到 2.0 }
            // ... 更多迁移

            // 当前所有版本都执行字段补全（向下兼容）
            migrated = ensureAllFields(migrated);

            // 更新版本号为最新
            migrated.version = CURRENT_VERSION;
            return migrated.version; // 返回最新版本
        }

        // 补全缺失字段（确保所有节点结构完整）
        function ensureAllFields(data) {
            function walk(node) {
                if (!node) return;
                node.photos ||= [];
                node.children ||= [];
                node.type ||= 'taxon';

                if (node.type === 'species') {
                    node.commonName ||= '';
                    node.latinName ||= '';
                    node.authors ||= '';
                    node.distribution ||= '';
                    node.habitat ||= '';
                    node.diagnosis ||= '';
                    node.description ||= '';
                    node.synonyms ||= [];
                    node.references ||= [];
                }
                if (node.type === 'content') {
                    node.html ||= '';
                }
                if (node.type === 'taxon') {
                    node.name ||= '未命名分类群';
                }

                if (node.children) {
                    for (let child of node.children) {
                        walk(child);
                    }
                }
            }
            walk(data);
            return data;
        }

        function saveAndRefresh() {
            saveData();
            renderTree();
            if (selectedNode) {
                const refreshed = findNodeById(treeData, selectedNode.id);
                if (refreshed) { selectedNode = refreshed;
                    showTaxonContent(refreshed); } else { selectedNode = treeData;
                    showTaxonContent(treeData); }
            }
        }

        // ============================================================
        // 📤 导入导出（含 IndexedDB 图片 + UUID 冲突处理 + 版本兼容）
        // ============================================================

        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        async function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.treeData || !data.treeData.id) {
                        toast('❌ 无效的数据格式：缺少 treeData');
                        return;
                    }

                    // ---- 版本迁移 ----
                    let importedTree = data.treeData;
                    if (!importedTree.version) importedTree.version = '1.0';
                    const newVersion = migrateData(importedTree);
                    importedTree.version = newVersion; // 更新为最新

                    // ---- UUID 冲突处理 ----
                    let existingUUIDs = new Set();
                    try {
                        const existing = await getAllImagesFromDB();
                        existingUUIDs = new Set(existing.map(entry => entry.id));
                    } catch (err) {
                        console.warn('获取已有图片列表失败', err);
                    }

                    const conflictMap = {};
                    const imageEntries = data.images || {};
                    for (let [uuid, base64] of Object.entries(imageEntries)) {
                        if (existingUUIDs.has(uuid)) {
                            const newUuid = generateUUID();
                            conflictMap[uuid] = newUuid;
                            console.log(`⚠️ UUID 冲突: ${uuid} -> ${newUuid}`);
                        }
                    }

                    if (Object.keys(conflictMap).length > 0) {
                        const jsonStr = JSON.stringify(importedTree);
                        let updatedStr = jsonStr;
                        for (let [oldUuid, newUuid] of Object.entries(conflictMap)) {
                            updatedStr = updatedStr.split(`[img:${oldUuid}]`).join(`[img:${newUuid}]`);
                        }
                        importedTree = JSON.parse(updatedStr);
                        toast(`🔄 检测到 ${Object.keys(conflictMap).length} 个UUID冲突，已自动重新生成`);
                    }

                    // ---- 恢复图片到 IndexedDB ----
                    let savedCount = 0;
                    for (let [uuid, base64] of Object.entries(imageEntries)) {
                        try {
                            const finalUuid = conflictMap[uuid] || uuid;
                            const response = await fetch(base64);
                            const blob = await response.blob();
                            await saveImageToDB(finalUuid, blob);
                            savedCount++;
                        } catch (err) {
                            console.warn('图片恢复失败', uuid, err);
                        }
                    }

                    // ---- 更新数据 ----
                    treeData = importedTree;
                    // 重建 idCounter
                    idCounter = rebuildIdCounter(treeData);

                    saveData();
                    selectedNode = treeData;
                    renderTree();
                    showTaxonContent(treeData);

                    // 更新最后导出时间（导入也算一次安全操作）
                    localStorage.setItem('lastExportTime', Date.now().toString());

                    toast(`✅ 导入成功！版本 ${data.version || '1.0'} → ${importedTree.version}，恢复 ${savedCount} 张图片`);
                } catch (err) {
                    console.error('导入失败:', err);
                    toast('❌ 导入失败: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ============================================================
        // 📤 导出（统一使用 treeData.version）
        // ============================================================

        async function exportData() {
            try {
                const allImages = await getAllImagesFromDB();
                const imageMap = {};
                for (let entry of allImages) {
                    try {
                        const base64 = await blobToBase64(entry.blob);
                        imageMap[entry.id] = base64;
                    } catch (e) {
                        console.warn('图片转换失败', entry.id, e);
                    }
                }
                // 使用 treeData.version 作为导出版本
                const exportVersion = treeData.version || CURRENT_VERSION;
                const exportObj = {
                    treeData: treeData,
                    images: imageMap,
                    version: exportVersion
                };
                const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `分类学笔记_${new Date().toISOString().slice(0,10)}.json`;
                a.click();

                // 记录导出时间
                localStorage.setItem('lastExportTime', Date.now().toString());
                toast(`📥 数据已导出（版本 ${exportVersion}，含 ${Object.keys(imageMap).length} 张图片）`);

                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            } catch (err) {
                console.error(err);
                toast('❌ 导出失败: ' + err.message);
            }
        }

        // ============================================================
        // 🔄 重置
        // ============================================================

        function resetAll() {
            if (!confirm('⚠️ 确定要重置所有数据吗？此操作不可撤销！')) return;
            treeData = deepClone(DEFAULT_DATA);
            treeData.version = CURRENT_VERSION;
            selectedNode = treeData;
            idCounter = 1000;
            saveData();
            getAllImagesFromDB().then(entries => {
                for (let entry of entries) {
                    deleteImageFromDB(entry.id).catch(() => {});
                }
            }).catch(() => {});
            renderTree();
            showTaxonContent(treeData);
            toast('🗑 已重置所有数据');
        }

        // ============================================================
        // 📐 左栏宽度拖拽
        // ============================================================

        function setupSidebarResizer() {
            const resizer = document.getElementById('sidebarResizer');
            const sidebar = document.getElementById('sidebar');
            let isResizing = false;

            resizer.addEventListener('mousedown', function(e) {
                isResizing = true;
                resizer.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                document.addEventListener('mousemove', onResize);
                document.addEventListener('mouseup', onResizeEnd);
                e.preventDefault();
            });

            function onResize(e) {
                if (!isResizing) return;
                const rect = sidebar.getBoundingClientRect();
                const newWidth = e.clientX - rect.left;
                if (newWidth >= 180 && newWidth <= 600) {
                    sidebar.style.width = newWidth + 'px';
                    document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
                }
            }

            function onResizeEnd() {
                isResizing = false;
                resizer.classList.remove('active');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                document.removeEventListener('mousemove', onResize);
                document.removeEventListener('mouseup', onResizeEnd);
                const w = sidebar.style.width;
                if (w) localStorage.setItem('sidebarWidth', w);
            }

            const savedWidth = localStorage.getItem('sidebarWidth');
            if (savedWidth) {
                const w = parseInt(savedWidth);
                if (w >= 180 && w <= 600) {
                    sidebar.style.width = w + 'px';
                    document.documentElement.style.setProperty('--sidebar-width', w + 'px');
                }
            }
        }

        // ============================================================
        // 📢 Toast（支持样式扩展）
        // ============================================================

        let toastTimer = null;

        function toast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            el.classList.remove('warning', 'info');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ============================================================
        // 🧩 全局异常处理
        // ============================================================

        function setupGlobalErrorHandling() {
            window.onerror = function(message, source, lineno, colno, error) {
                console.error('【全局错误】', message, source, lineno, colno, error);
                toast('⚠️ 发生未知错误，请按 F12 查看控制台详情');
                try {
                    const log = JSON.parse(localStorage.getItem('errorLog') || '[]');
                    log.push({
                        time: new Date().toISOString(),
                        message: String(message),
                        source: source || '',
                        lineno: lineno || 0,
                        colno: colno || 0,
                        stack: error ? error.stack : ''
                    });
                    if (log.length > 50) log.shift();
                    localStorage.setItem('errorLog', JSON.stringify(log));
                } catch (e) { /* 忽略日志写入错误 */ }
                return true;
            };

            window.onunhandledrejection = function(event) {
                console.error('【未处理的Promise拒绝】', event.reason);
                toast('⚠️ 发生异步错误，请按 F12 查看控制台详情');
                try {
                    const log = JSON.parse(localStorage.getItem('errorLog') || '[]');
                    log.push({
                        time: new Date().toISOString(),
                        type: 'unhandledrejection',
                        reason: String(event.reason)
                    });
                    if (log.length > 50) log.shift();
                    localStorage.setItem('errorLog', JSON.stringify(log));
                } catch (e) { /* 忽略 */ }
                event.preventDefault();
            };

            window.addEventListener('error', function(e) {
                if (e.target && (e.target.tagName === 'IMG' || e.target.tagName === 'SCRIPT')) {
                    console.warn('资源加载失败:', e.target.src || e.target.href);
                    return;
                }
                if (!e.message) return;
                toast('⚠️ 页面发生错误，请查看控制台');
            }, true);
        }

        // ============================================================
        // 📌 备份提醒（P0-2 改进：首次启动用模态框）
        // ============================================================

        let backupCheckDone = false;

        function checkBackupReminder() {
            if (backupCheckDone) return;
            backupCheckDone = true;

            const hasSeenWelcome = localStorage.getItem('hasSeenWelcome');
            if (!hasSeenWelcome) {
                // 第一次启动：弹模态框
                showModal({
                    title: '🌿 欢迎使用 DHI 分类学笔记',
                    content: `
                        <p style="font-size:1rem;line-height:1.8;">
                            数据保存在本地浏览器中，<strong>请定期导出 JSON 备份</strong>，以防缓存清理导致数据丢失。
                        </p>
                        <p style="margin-top:12px;color:#666;">
                            建议每次重要更新后点击「导出JSON」保存。
                        </p>
                        <div style="margin-top:20px;text-align:center;">
                            <button class="btn-save" onclick="closeModal();" style="font-size:1rem;padding:8px 32px;">知道了</button>
                        </div>
                    `,
                    hideFooter: true
                });
                localStorage.setItem('hasSeenWelcome', 'true');
                localStorage.setItem('lastBackupCheck', Date.now().toString());
                return;
            }

            // 非首次：检查是否超过7天未备份
            const lastExport = localStorage.getItem('lastExportTime');
            if (lastExport) {
                const days = (Date.now() - parseInt(lastExport)) / (1000 * 60 * 60 * 24);
                if (days > 7) {
                    const toastEl = document.getElementById('toast');
                    toastEl.classList.add('warning');
                    toast('⚠️ 已超过7天未备份数据，建议点击「导出JSON」保存。');
                    setTimeout(() => {
                        toastEl.classList.remove('warning');
                    }, 4000);
                }
            } else {
                // 从未导出过，温和提醒
                const lastCheck = localStorage.getItem('lastBackupCheck');
                if (!lastCheck || (Date.now() - parseInt(lastCheck)) > 24 * 60 * 60 * 1000) {
                    toast('💡 提示：点击「导出JSON」可备份所有数据（含图片）');
                    localStorage.setItem('lastBackupCheck', Date.now().toString());
                }
            }
        }

        // ===== 退出前提醒 =====
        let hasShownExitWarning = false;

        function setupBeforeUnload() {
            window.addEventListener('beforeunload', function(e) {
                if (hasShownExitWarning) return;
                const lastExport = localStorage.getItem('lastExportTime');
                if (lastExport) {
                    const days = (Date.now() - parseInt(lastExport)) / (1000 * 60 * 60 * 24);
                    if (days > 7) {
                        hasShownExitWarning = true;
                        e.preventDefault();
                        e.returnValue = '您已超过7天未备份数据，建议导出JSON备份后再离开。';
                        setTimeout(() => { hasShownExitWarning = false; }, 2000);
                        return;
                    }
                }
                if (!lastExport) {
                    hasShownExitWarning = true;
                    e.preventDefault();
                    e.returnValue = '您尚未导出过数据，建议备份后再离开。';
                    setTimeout(() => { hasShownExitWarning = false; }, 2000);
                }
            });
        }

        // ============================================================
        // 🚀 初始化
        // ============================================================

        function init() {
            setupGlobalErrorHandling();

            if (!loadData()) {
                treeData = deepClone(DEFAULT_DATA);
                treeData.version = CURRENT_VERSION;
                selectedNode = treeData;
                idCounter = 1000;
                saveData();
            } else {
                if (!treeData || !treeData.id) {
                    treeData = deepClone(DEFAULT_DATA);
                    treeData.version = CURRENT_VERSION;
                    saveData();
                }
                // 确保所有字段完整（兼容旧数据）
                ensureAllFields(treeData);
                // 确保版本号
                treeData.version = CURRENT_VERSION;
                saveData();
                selectedNode = treeData;
            }

            renderTree();
            showTaxonContent(treeData);
            setupSearch();
            setupLightbox();
            setupSidebarResizer();

            const savedSize = localStorage.getItem('cardSize') || 'medium';
            setCardSize(savedSize);

            if (localStorage.getItem('editMode') === 'true') {
                setTimeout(() => { if (!isEditMode) toggleEditMode(); }, 100);
            }

            // ---- 备份提醒（首次弹模态框，后续 Toast） ----
            setTimeout(checkBackupReminder, 600);

            // ---- 退出前提醒 ----
            setupBeforeUnload();

            document.getElementById('modalCloseBtn').onclick = closeModal;
            document.getElementById('speciesModalClose').onclick = function() {
                document.getElementById('speciesModal').classList.remove('active');
            };
            document.getElementById('speciesModal').addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('active');
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'e') { e.preventDefault();
                    toggleEditMode(); }
            });

            console.info("DHI Taxonomic Notebook v1.0.0");
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
